[AUTHOR]
# Urheberschaft des Originalplugins. Nicht aendern: LoxBerry identifiziert
# das Plugin ueber NAME und EMAIL, und die Apache-Lizenz verlangt die Nennung.
NAME=Christian Woerstenfeld
EMAIL=git@loxberry.woerstenfeld.de

[PLUGIN]
VERSION=1.1.0
NAME=BLE-Scanner
FOLDER=ble_scanner
TITLE=BLE-Scanner

[SYSTEM]
# In der Originalfassung stand dieser Abschnitt zweimal in der Datei, mit
# unterschiedlichen Werten fuer LB_MINIMUM. Welcher davon galt, haengt vom
# Parser ab - jetzt gibt es nur noch einen.
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=2.0
LB_MAXIMUM=false
# Ohne Architekturbindung: die Python-2-Bibliothek pybluez und die
# Raspberry-Pi-Pakete sind entfallen, BlueZ ueber D-Bus laeuft ueberall.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Beide URLs zeigen auf diese Fortfuehrung, nicht auf das Original.
# Zeigten sie auf die Originalquelle, holte LoxBerry beim naechsten
# Update-Lauf die alte Fassung und ueberschriebe den Umbau.
# Der Zweig heisst hier master, nicht main.
AUTOMATIC_UPDATES=true

RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BLE-Scanner/master/release.cfg

PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BLE-Scanner/master/prerelease.cfg
