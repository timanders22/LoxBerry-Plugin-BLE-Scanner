[AUTHOR]
# ACHTUNG - hier stand bis 1.1.0 die Urheberschaft des Originalplugins
# (Christian Woerstenfeld), mit der Begruendung, die Apache-Lizenz verlange
# die Nennung an dieser Stelle. Das war aus zwei Gruenden falsch:
#
# 1. LoxBerry benutzt NAME und EMAIL als KENNUNG des Plugins, nicht als
#    Urhebervermerk.
# 2. Fehlerberichte waeren beim Originalautor gelandet, der mit dieser
#    Fassung nichts zu tun hat.
#
# Die von der Apache-Lizenz verlangte Nennung steht dort, wo sie hingehoert:
# in NOTICE (samt Liste der Aenderungen nach Abschnitt 4 b), in README.md, in
# der Hilfeseite und im Kopf der Python-Dateien.
NAME=BLE-Scanner NG LoxBerry Plugin Authors
EMAIL=ble-scanner-loxberry@users.noreply.github.com

[PLUGIN]
VERSION=1.3.1
# Ohne Leerzeichen und klein - LoxBerry filtert Leerzeichen heraus, und aus
# NAME werden Skript- und Dienstnamen gebildet. Der Anzeigename steht in TITLE.
NAME=ble_scanner_ng
FOLDER=ble_scanner_ng
TITLE=BLE-Scanner NG

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Ohne Architekturbindung: die Python-2-Bibliothek pybluez und die
# Raspberry-Pi-Pakete sind entfallen, BlueZ ueber D-Bus laeuft ueberall.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
# Beide URLs zeigen auf diese Fortfuehrung, nicht auf das Original.
# Der Zweig heisst hier master, nicht main.
AUTOMATIC_UPDATES=true

RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BLE-Scanner/master/release.cfg

PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-BLE-Scanner/master/prerelease.cfg
