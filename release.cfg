[AUTOUPDATE]
# Diese Datei wird von LoxBerry abgefragt, wenn Auto-Update eingeschaltet ist.
#
# SECHS Stellen tragen die Fassungsnummer und muessen zusammenpassen:
#   plugin.cfg VERSION, diese Datei (VERSION und beide URLs),
#   prerelease.cfg, der Ordnername, das Archiv und der Tag auf GitHub.
# Dazu <configdir>/fassung.txt, das postinstall.sh aus $PVERSION schreibt -
# daraus lesen bl_common.py und bl_lib.php ihre Nummer, damit sie nicht ein
# viertes Mal getippt werden muss.
#
# Werkzeuge/fassung_setzen.py setzt die vier Dateistellen in einem Zug und
# weigert sich, die beiden .cfg zu schreiben, solange der Tag nicht antwortet.

VERSION=1.3.3
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-BLE-Scanner/archive/refs/tags/v1.3.3.zip

INFOURL=https://github.com/timanders22/LoxBerry-Plugin-BLE-Scanner/releases/tag/v1.3.3
