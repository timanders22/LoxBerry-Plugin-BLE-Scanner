<?xml version="1.0" encoding="UTF-8"?>
<!--
  BLE-Scanner - Plugin-Symbol nach Hausstandard.
  Runde Scheibe in LoxBerry-Gruen #6dac20, Motiv weiss:
  Bluetooth-Rune mit zwei Reichweitenbogen.
  Keine fremde Wortmarke, kein Herstellerlogo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <circle cx="256" cy="256" r="256" fill="#6dac20"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>

  <!-- Bluetooth-Rune: Strichzug von unten nach oben und zurueck -->
  <path d="M 196 176 L 300 328 L 226 384 L 226 128 L 300 184 L 196 336"
        fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Reichweitenbogen rechts -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <path d="M 330 206 a 68 68 0 0 1 0 100"/>
    <path d="M 372 168 a 128 128 0 0 1 0 176"/>
  </g>
</svg>
