; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "BLE Scanner NG"
K02 = "Detects Bluetooth Low Energy devices within range and tells the Loxone Miniserver whether a registered tag is present — including the signal strength. Typical use: a key fob as presence detection."
K03 = "Set up in three steps"
K04 = "<i>Settings</i> tab → <i>Search for devices</i>. The tag you are looking for should be nearby while you do this."
K05 = "Tick the device you found, give it a label and save."
K06 = "<i>Loxone integration</i> tab → download the template and paste it into Loxone Config."
K07 = "Not every device is suitable"
K08 = "Phones, watches and headphones <b>change their Bluetooth address regularly</b> — often every 15 minutes. That is a privacy feature and cannot be switched off. Such devices are useless for presence detection: the address you entered is only valid until the next change."
K09 = "Simple BLE beacons and key finders with a fixed address are reliable. You can check this by searching for the address again a few days later: if it is unchanged, it is fixed."
K10 = "Presence flickers"
K11 = "BLE tags do not transmit continuously but at intervals of seconds to minutes — the more frugal the tag, the rarer. If a tag keeps flipping between present and absent, the <i>absent after</i> time is set too short. 60 to 120 seconds is usual for frugal tags."
K12 = "Nothing is found"
K13 = "<i>Test</i> tab → <i>Check Bluetooth</i>: is an adapter listed? Without an adapter nothing works — a Raspberry Pi without built-in Bluetooth needs a USB adapter."
K14 = "Some tags only advertise after a button press."
K15 = "<i>Test</i> tab → <i>Service state</i>: is it running at all?"
K16 = "BlueZ permits only <b>one</b> scan at a time. If another program is scanning for Bluetooth in parallel, the two interfere."
K17 = "MQTT or HTTP"
K18 = "<b>MQTT is the recommended way.</b> The states arrive retained; after a restart of the Miniserver the presence state is there again immediately."
K19 = "The <b>HTTP path</b> is the way of the original version: on every change a virtual input on the Miniserver is set. It is kept, and can be switched off, so that existing Loxone configurations keep working. The credentials now travel in the Authorization header instead of in the address."
K20 = "What has changed since 2021.2.3"
K21 = "The scanner runs under <b>Python 3</b> and talks to <b>BlueZ over D-Bus</b>. The old version was Python 2 and used pybluez and <tt>hciconfig</tt> — neither of which exists on LoxBerry 4 any more."
K22 = "A <b>continuously running service</b> instead of scanning on request: Loxone no longer has to poll anything."
K23 = "In addition to present/absent there are now <b>RSSI, signal level, age of the last sighting</b> and the reported device name."
K24 = "The existing configuration is carried over — registered tags are kept."
