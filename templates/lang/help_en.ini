; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the
; help file and looks for it in templates/lang/ - not next to the help
; file. Every value is in double quotes and contains none itself;
; markup stays raw, the help page is not escaped.

[HILFE]
K01 = "BLE-Scanner NG"
K02 = "Detects Bluetooth Low Energy devices in range and reports to the Loxone Miniserver whether a configured tag is present — including signal strength, timestamp and, where the device sends them, temperature, humidity and battery level. Typical use: a key fob for presence detection."
K03 = "Set up in four steps"
K04 = "Tab <i>Settings</i> → <i>Search for devices</i>. The tag you are looking for should be nearby. The <i>Address type</i> column says immediately whether the device is suitable at all."
K05 = "Tick the device found, give it a label and save."
K06 = "Tab <i>MQTT</i> → the subscription <tt>&lt;prefix&gt;/#</tt>. <b>Applies to MQTT gateway&nbsp;V1:</b> since 1.3.20 the plugin enters it itself in its subscription file <tt>config/plugins/&lt;folder&gt;/mqtt_subscriptions.cfg</tt>, which the gateway reads - at service start and when saving in the MQTT tab; nothing needs to be entered by hand. From version&nbsp;2 the topic group appears by itself under Subscriptions."
K07 = "Tab <i>Loxone integration</i> → create one Virtual Input per row of the name table (name exactly as the MQTT gateway assigns it), then work through the three block lists from the LoxBerry plugins sample project from top to bottom – each page with instructions, notes and picture. Since 1.3.28 there is no template with Virtual HTTP Inputs any more."
K08 = "Not every device is suitable"
K09 = "Mobile phones, watches and headphones <b>rotate their Bluetooth address regularly</b> — often every 15 minutes. This is a privacy feature and cannot be switched off. Such devices are useless for presence detection: the stored address is only valid until the next change."
K10 = "Since 1.3.0 you no longer have to find this out the hard way: the device list shows <i>fixed</i>, <i>static random</i> or <i>rotating</i> per device. Only the first two are usable. If you still want to include a phone, let it advertise as an iBeacon and enter the identifier <tt>ib:UUID:major:minor</tt> instead of the address — that stays stable."
K11 = "Presence flickers"
K12 = "BLE tags do not transmit continuously but at intervals of seconds to minutes. The <i>History</i> tab shows the <b>largest reception gap</b> per tag over the last 24 hours and derives a suggestion for the away delay from it. That replaces guessing."
K13 = "The other way round: for <b>arrival</b>, up to 1.2.10 a single received packet of any strength was enough. If you do not want a passer-by on the street to switch on the lights, set <i>Sightings until present</i> to 2 or 3 and <i>Minimum signal strength</i> to about −85 dBm."
K14 = "Nothing is found"
K15 = "Tab <i>Test</i> → the self-check answers with ticks and crosses what the problem is. A <b>dash</b> means: could not be measured — that is not a tick. Since 1.3.30 the Test tab checks under MQTT gateway V2 that all data points of the tick list are ticked and “Noncached” is right."
K16 = "The line <i>Are any advertisements arriving at all?</i> is the most important one. If it shows a cross, the adapter is no longer hearing anything; the watchdog will then reset it by itself."
K17 = "Some tags only advertise after a button press."
K18 = "BlueZ only allows <b>one</b> discovery at a time. If another program is scanning in parallel, they interfere with each other."
K19 = "MQTT or HTTP"
K20 = "<b>MQTT is the standard path.</b> States arrive retained; after a Miniserver restart presence is available again at once. The sign of life for Loxone is <tt>status/zaehler</tt>: it counts on by one at most every 30 seconds (0–999) and is never retained. <tt>server/ts</tt> remains for existing installations. Without a sign of life a dead service looks exactly like a quiet house in Loxone."
K21 = "The <b>HTTP path</b> is the approach of the original version and remains available as an option so that existing Loxone configurations keep working. Since 1.3.0 it carries <b>the same values as MQTT</b>, and a value that failed to arrive because of a fault is remembered and retried."
K22 = "What the plugin delivers besides presence"
K23 = "<b>Advertising data</b>: iBeacon, Eddystone, ATC/pvvx, RuuviTag, MiBeacon (Xiaomi/Mijia, <tt>0xFE95</tt>) and the open Qingping form (<tt>0xFDCD</tt>) are decoded. A Xiaomi thermometer <tt>MJ_HT_V1</tt> (LYWSDCGQ/01ZM) sends unencrypted and thereby delivers temperature and humidity per room, without WiFi and without cloud &mdash; since version&nbsp;1.3.13 <b>as shipped</b>. Since 1.3.29 the service also reads <b>encrypted MiBeacon packets of version&nbsp;4/5</b> (e.g. LYWSD03MMC, MJWSD05MMC, LYWSD02MMC, XMWSDJ04MMC) &mdash; with the bind key of the device (section <i>Bind key and Xiaomi cloud</i>). A wrong key gives no value but the state “bind key does not match”. Encrypted packets of the old form (version&nbsp;2/3) are deliberately <b>not</b> decrypted (no MIC to check) and are reported as “old form”, not guessed. This has not yet been measured on a device with an encrypting sensor. Where the values go in Loxone is described in the <i>Loxone integration</i> tab."
K24 = "<b>Battery level</b>: from the advertising data for Eddystone TLM and RuuviTag, otherwise optionally once a day over a connection. The connection route is off by default — it pauses scanning, and some key finders beep while it happens."
K25 = "<b>Distance</b> in metres, estimated from signal strength. The <i>Test</i> tab has a button that measures the reference value at one metre."
K26 = "<b>Persons</b>: several tags can be grouped into one human being. <tt>person/&lt;name&gt;/present</tt> is then the OR over their presence — the OR no longer has to be built in Loxone."
K27 = "Multiple scanners"
K28 = "Two LoxBerrys running this plugin against the same broker used to overwrite each other's states. With a <i>scanner name</i> each gets its own topic branch; if <i>room assignment</i> is also enabled, the plugin publishes per tag the name of the scanner with the strongest signal. Two things matter here and both are adjustable: a hysteresis so the room does not jump between two scanners, and a correction value per scanner, because a USB adapter with an external antenna hears systematically stronger than a Pi Zero."
K29 = "What has changed compared to 2021.2.3"
K30 = "The scanner runs under <b>Python 3</b> and talks to <b>BlueZ over D-Bus</b>. The old version was Python 2 and used pybluez and <tt>hciconfig</tt> — neither of which exists on LoxBerry 4 any more."
K31 = "A <b>continuously running service</b> instead of scan on demand: Loxone no longer has to poll anything."
K32 = "Since 1.3.0 the service works <b>event driven</b>: BlueZ reports every change instead of the whole object directory being queried every few seconds. It therefore sees every advertising packet instead of one sample per round."
K33 = "The states have become <b>calmer</b>: signal strength is smoothed, the signal level has hysteresis, and arrival can be debounced."
K34 = "An existing configuration is adopted — configured tags are preserved."
K35 = "When the service is not running"
K36 = "Then a box above the tabs says what to do. The <i>present</i> tile, the tag table, the live view and the rows of the <i>Test</i> tab that read the state file of the service show <b>no statement</b> with the time of the last state - never green and never present. The same applies when the state file is older than three times the cycle (at least 90 seconds)."
K37 = "Stopping, target flag and watchdog"
K38 = "<i>Stop service</i> stores the decision next to the data folder (<tt>&lt;folder&gt;.soll_laufen</tt> with the content 0): the service stays stopped across a LoxBerry restart and an update until <i>Start service</i> is pressed. Without this flag it counts as switched on. A watchdog (<tt>cron.05min</tt>) restarts a service that should run every five minutes if no process runs or its state file is older than five times the cycle (at least 180 seconds) - at most three times per hour, and never during an update."
K39 = "Detecting a failure in Loxone"
K40 = "<tt>present</tt> and <tt>anwesend_gesamt</tt> are only valid together with <tt>server/online</tt>. If the service dies, the last state stays retained in the broker; the broker itself sets <tt>server/online</tt> to 0 as last will, also after a crash. Fault detection therefore uses <tt>server/online</tt> and the sign of life <tt>status/zaehler</tt> (Value Validator, Tmc 120 s), not <tt>server/ok</tt>. The page “BLE-Scanner NG” in the tab <i>Loxone integration</i> combines both into “Störung (BLE)”; while it is active, “Niemand zu Hause (BLE)” does not switch."
K41 = "Presence with the WiFi scanner (off by default)"
K42 = "Since 1.3.28 <tt>person/&lt;person&gt;/anwesend_gesamt</tt> and <tt>/quelle</tt> always arrive - without coupling as BLE presence (source <tt>ble</tt>, -1 = no statement); switching the coupling on needs no rewiring. In the <i>Settings</i> tab the presence of a person from this plugin can be combined with that from the plugin <b>WiFi-Scanner NG</b>. The coupling only uses its MQTT topics <tt>wifi_ng/&lt;Name&gt;</tt>, <tt>wifi_ng/status/ts</tt> and <tt>wifi_ng/status/ok</tt> - the WiFi scanner only sends them when UDP is switched off there. The mapping names <tt>WiFi-name=person</tt> per person. Sent are <tt>person/&lt;Person&gt;/anwesend_gesamt</tt> (1 if one source says present; 0 if both say away; - without a statement) and <tt>person/&lt;Person&gt;/quelle</tt>, both retained. If the WiFi scanner is silent for longer than three times its interval (at least 3 minutes), only BLE counts, and the <i>Test</i> tab says so. When switched off, the service clears both topics."
K43 = "Commands from Loxone (off by default)"
K44 = "With the tick <i>Accept commands via MQTT</i> (tab <i>MQTT</i>) the command bridge accepts <tt>&lt;prefix&gt;/befehl/testmodus &lt;branch&gt;</tt> and <tt>&lt;prefix&gt;/befehl/kalibrierung &lt;branch&gt;</tt> – Loxone sends them via the UDP input of the MQTT gateway; the branch is the alias of the tag, never its address. <tt>&lt;prefix&gt;/befehl/batterie 1</tt> intervenes (connection to the fob) and additionally needs <i>Accept intervening commands via MQTT</i>; at most once per hour. Every answer is under <tt>&lt;prefix&gt;/befehl/&lt;name&gt;/quittung</tt>, never retained. The template <i>MQTT commands</i> in the tab <i>Loxone integration</i> creates the commands."
K45 = "Presence for other plugins (off by default)"
K46 = "With <i>Provide presence for other plugins</i> (tab <i>Settings</i>) the service sends, following the house rule for haus topics, <tt>haus/anwesenheit/&lt;person&gt;</tt> and <tt>haus/anwesenheit/jemand</tt> (1/0, no statement <tt>-</tt>, retained) and as sign of life <tt>haus/anwesenheit/zaehler</tt> (every 30 s, never retained): a consumer uses the presence only while the counter changes within 120 s. For each tag with the tick <i>report to other plugins</i>, <tt>haus/tag/&lt;name&gt;/da</tt> is added. Only one scanner in the house may be the provider. When switched off and on uninstall the plugin removes only its own haus topics, checking back with the broker."
K47 = "Phones and watches with a changing address (IRK, off by default)"
K48 = "A device with a changing address can be recognised by its identity key (IRK, 16 bytes): enter it as tag <tt>IRK:&lt;name&gt;</tt>, give it an alias, store the key in the field <i>Key (IRK)</i> and switch on <i>Resolve changing addresses via a key (IRK)</i>. The key is only kept in <tt>irk.json</tt> (rights 0600), never in the log and never in the interface. Resolution according to the Bluetooth specification (Vol 3 Part H, ah()); without python3-cryptography the plugin computes AES itself. No pairing is touched. On the device this can only be accepted with a real phone."
K49 = "BTHome v2 (Shelly BLU)"
K50 = "Unencrypted BTHome v2 devices (e.g. Shelly BLU H&amp;T, door/window, motion, button) deliver temperature, humidity, illuminance, window, motion and battery under <tt>&lt;tag&gt;/sensor/…</tt>; a button press arrives as <tt>&lt;tag&gt;/button</tt> (press, double_press, long_press …), once per press, never retained – in the MQTT gateway V2 with <i>Resetaftersend</i>. On for a new installation, off after an update (tab <i>Settings</i>). Checked against bthome.io, not measured on a device in the house."
K51 = "Bind key and Xiaomi cloud"
K52 = "ESPresense and further room receivers"
K53 = "Persons and rooms (off as shipped)"
K54 = "The bind key of an encrypting Xiaomi sensor is entered per MAC row under <i>More settings for this tag</i> (<i>Settings</i> tab): password field, never pre-filled, 32 hex characters (24 hex characters of the old form are saved with a notice), plus the tick box <i>Delete key</i>. It is stored in <tt>bindkey.json</tt> (0600, saved during an update like <tt>irk.json</tt>); only “stored” or “missing” is shown, never digits. The plugin can also fetch the key from the <b>Xiaomi cloud</b>: sign-in with account and password (never stored, never logged), captcha image and second factor by mail or SMS in the plugin, then a list of the Bluetooth devices only (name, model, MAC, region &mdash; without keys). Several thermometers can be ticked and taken over in one go with <i>Take over ticked ones</i>; the key goes to the tag with this MAC, otherwise a new tag is created. After pairing again in Mi Home the key no longer matches and has to be fetched again. The backup carries the bind keys and must be treated like a password; since 1.3.38 an entry in it that does not fit makes the whole restore fail. The cloud fetch has only been measured against a mock."
K55 = "With <i>Derive room assignment from several scanners</i> (<i>Settings</i> tab, section <i>Multiple scanners</i>, off as shipped) every tag reports <tt>&lt;tag&gt;/raum</tt> and <tt>&lt;tag&gt;/raum_seit</tt>: the receiver with the strongest signal wins, with hysteresis and offset. Receivers are further LoxBerrys with this plugin on the same broker (each with its own scanner name) and, with the tick box <i>Include ESPresense receivers in the room assignment</i> (off as shipped), ESP32 boards with the free firmware ESPresense; the room assignment takes their messages <tt>espresense/devices/&lt;id&gt;/&lt;room&gt;</tt> into account. Which ESPresense id belongs to which tag is set in <i>Mapping ESPresense id = tag alias</i>; if the id already equals the alias, no entry is needed. Ids heard without a mapping are listed in the <i>Test</i> tab. This only works with the room assignment and MQTT switched on. <b>Receivers only deliver the room:</b> presence (<tt>present</tt>) remains the statement of this LoxBerry. The ESPresense path has so far only been measured in the self test, not with real receivers in the house. Since 1.3.38 a receiver can also carry presence with the tick box <i>Room receivers keep the tag present</i> (off as shipped, works only with the room assignment switched on): if this LoxBerry does not hear a tag, a fresh report of a receiver counts as a sighting &mdash; only for an explicitly assigned tag (pair in the mapping or id equal to the alias), only within <i>Away after</i> and only from the <i>Minimum signal strength</i> on. <tt>person/&lt;person&gt;/quelle</tt> then says <tt>empfaenger</tt> (with WiFi <tt>empfaenger+wlan</tt>); the other values keep their meaning. A model id like <tt>apple:1005:9-26</tt> is shared by many devices and then does not belong in the mapping. This too has only been measured in the self test."
K56 = "With the tick box <i>Report persons and rooms</i> and the room assignment switched on, every person with a tag gets <tt>person/&lt;person&gt;/raum</tt> (<tt>-</tt> if not present) and <tt>person/&lt;person&gt;/raum_seit</tt> (time of the last change of the person), and every room <tt>summary/raum/&lt;room&gt;/anzahl</tt> (retained) and <tt>summary/raum/&lt;room&gt;/namen</tt> (not retained, empty if nobody is there). If a person has several present tags with a room, since 1.3.38 the room of the tag that changed its room last applies; if the tags have been in their rooms equally long, the previous room of the person stays, otherwise the tag seen last applies. A key resting in the hall no longer makes the room jump with every packet. A room appears as soon as somebody has been in it once and then reports 0 until the next service start. When switched off, the service removes the topics from the broker. <b>Which topic for “person is present and in room X”:</b> <tt>person/&lt;person&gt;/raum</tt> &mdash; it shows <tt>-</tt> as soon as the person is not present. <tt>&lt;tag&gt;/raum</tt>, in contrast, keeps showing the last room after a tag has disappeared, until the last report of this LoxBerry or of a receiver is older than 30&nbsp;s or than <i>Away after</i> if that is longer (the setting in the <i>Settings</i> tab, not the period per tag). After a restart of the service it reads, since 1.3.38, its retained times <tt>present_since</tt> and <tt>raum_seit</tt> once from the broker and keeps them if presence or room has stayed the same; a value that is not a whole number, lies in the future or before 2020 does not count &mdash; then the start time applies as before."
