S1 = "Schritt 1: Tags eintragen"
S1_TEXT = "Im Reiter Einstellungen, am einfachsten über Geräte suchen, anhaken und speichern. Ein Gerät, dessen Adresse als wechselnd angezeigt wird, taugt nicht."
S2 = "Schritt 2: Das Abo im MQTT-Gateway"
S2_TEXT = "Ohne diesen Eintrag kommt am Miniserver nichts an. Einzutragen unter System, MQTT Gateway, Subscriptions:"
S3 = "Schritt 3: Virtuelle Eingänge anlegen"
S3_TEXT = "Am schnellsten über die Vorlage weiter unten. Von Hand angelegt heißt ein Eingang genau so wie das Thema, mit Unterstrich statt Schrägstrich."
