[LOX]
S1 = "Schritt 1: Tags eintragen"
S1_TEXT = "Im Reiter Einstellungen, am einfachsten über Geräte suchen, anhaken und speichern. Ein Gerät, dessen Adresse als wechselnd angezeigt wird, taugt nicht."
S2 = "Schritt 2: Das Abo im MQTT-Gateway"
S3 = "Schritt 3: Virtuelle Eingänge anlegen"
S3_TEXT = "Am schnellsten über die Vorlage weiter unten. Von Hand angelegt heißt ein Eingang genau so wie das Thema, mit Unterstrich statt Schrägstrich."
S4 = "Schritt 4: Kachel in der App"
S4_TEXT = "Einen Status-Baustein anlegen und v1 mit summary_present verbinden. Das ist die Zahl der anwesenden Tags; als Statustext eignet sich v1.0 von N sind da."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Dienst aus, sieht in der App alles normal aus. Deshalb server_online auswerten — das setzt der Broker als Letzten Willen selbst auf 0 — und das Alter von server_ts, das höchstens alle 30 Sekunden kommt. server_ok taugt dafür nicht: es steht nach einem harten Absturz weiter auf 1. Die Anwesenheit eines Tags (present) gilt nur, solange server_online 1 ist. Baustein-Liste #16 bis #19."
S6 = "Schritt 6: Anwesenheit entprellen"
S6_TEXT = "BLE-Tags senden nicht ununterbrochen. Ein einzelner verpasster Empfang darf keine Abwesenheit auslösen. Dafür gibt es im Plugin Abwesend nach, und in Loxone zusätzlich eine Ausschaltverzögerung. Der Reiter Verlauf nennt eine Zahl, sobald genug Daten da sind."

