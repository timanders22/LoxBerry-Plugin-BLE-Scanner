; BLE-Scanner NG - Sprachdatei (de)
; ERZEUGT von Werkzeuge/ble_sprache_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen entstehen aus derselben Tabelle; sie koennen deshalb nicht
; auseinanderlaufen. Wer einen Text aendert, aendert ihn dort.
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Umlaute stehen als direkte UTF-8-Zeichen: die Oberflaeche schickt jeden
; Wert durch bl_e(), eine Entitaet waere doppelt maskiert.

[ADRESSTYP]
FEST = "fest"
STATISCH = "statisch zufällig"
UNBEKANNT = "unbekannt"
WECHSELND = "wechselt"

[ART]
ANALOG = "analog"
DIGITAL = "digital"
TEXT = "Text"

[BAUSTEIN]
SEITE1_H1 = "<b>Zu Nr. 7:</b> Virtuelle Eingänge behalten ihren letzten Wert; nur das stehende Lebenszeichen verrät einen hängenden Dienst. Kommt innerhalb Tmc kein neuer Wert, meldet die Analogwertvalidierung an ihrem Ausgang E – den Haken bei ‚En‘ im Eigenschaftsfenster entfernen."
SEITE1_H2 = "<b>Zu Nr. 9 und 17:</b> blescanner_server_online ist der Letzte Wille; blescanner_server_ok taugt nicht dafür, es kommt nach einem harten Absturz nicht mehr."
SEITE1_H3 = "<b>Zu Nr. 15 bis 18:</b> anwesend_gesamt kommt immer – ohne WLAN-Kopplung ist es die BLE-Anwesenheit (-1 = keine Aussage). Wer die Kopplung später einschaltet, muss nichts umverdrahten."
SEITE1_H4 = "<b>Zu Nr. 19 und 20:</b> die Verzögerung kommt zur Einstellung „Abwesend nach“ im Plugin hinzu; beide zusammen ergeben die Gesamtzeit."
SEITE1_H5 = "<b>Zu Nr. 21 und 22:</b> „Jemand zu Hause (BLE)“ und „Niemand zu Hause (BLE)“ sind die fertigen Schaltsignale. Im eigenen Projekt ersetzen sie die Platzhalter „Anwesenheit (eigene Quelle)“ und „Niemand zu Hause (eigene Quelle)“: deren Abnehmer an Nr. 21 bzw. 22 legen, Platzhalter löschen. Bei einer Störung bleibt Nr. 22 auf 0 – eine tote Erkennung darf keine Abwesenheitslogik auslösen."
SEITE1_H6 = "Eine dritte Person: Eingang anwesend_gesamt, Formel wie Nr. 17, Ausschaltverzögerung wie Nr. 19, dann über ein weiteres ODER (je zwei Eingänge) zu Nr. 21."
SEITE1_H7 = "Andere Plugins lesen die Anwesenheit nicht aus diesen Eingängen, sondern aus haus/anwesenheit/… (Reiter Einstellungen „Anwesenheit für andere Plugins bereitstellen“, ab Werk aus)."
SEITE1_H8 = "Die Meldungen kommen frühestens nach 10 Minuten Störung; „Meldung Alle gegangen (BLE)“ einmal je Weggang (und nach jedem Übertragen erneut, solange niemand da ist)."
SEITE1_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ → „Geräte suchen“, die Schlüsselanhänger anhaken (nur Geräte mit fester Adresse – Telefone wechseln ihre Adresse; dafür gibt es die Tag-Art IRK), speichern. Je Tag die Zusatzangaben setzen: „Alias“ (z. B. schluessel1 – dann bleibt der Name in Loxone gleich, wenn der Anhänger getauscht wird) und „Person“ (z. B. Person1; mehrere Anhänger einer Person bekommen denselben Namen). Speichern."
SEITE1_SCHRITT2 = "Reiter „MQTT“: „Zustände per MQTT veröffentlichen“ ist ab Werk an. Gateway V1: das Abo blescanner/# trägt das Plugin selbst ein. Gateway V2: unter System → MQTT Gateway → Subscriptions die Themen der Namenstabelle (oben) anhaken, server/ok zusätzlich „Noncached“."
SEITE1_SCHRITT3 = "In Loxone Config je Eingang der Liste einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge), Name genau wie in der Spalte „Name“ (bzw. der Namenstabelle oben), „Als Digitaleingang“ NICHT anhaken; Texte als Virtueller Texteingang. Der LoxBerry-Benutzer braucht im Miniserver Rechte. Eine Vorlage mit Virtuellen HTTP-Eingängen gibt es nicht mehr."
SEITE1_SCHRITT4 = "Seite „BLE-Scanner NG“ anlegen, die 7 Eingänge der Liste ziehen (Nr. 1–5, 15, 16), dazu die Konstante 1 (Nr. 6)."
SEITE1_SCHRITT5 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Plugin gestört (BLE)“ und „Meldung Alle gegangen (BLE)“, Texte wie in der Tabelle."
SEITE1_SCHRITT6 = "Übrige Bausteine über die Baustein-Suche (F5), Parameter wie in der Tabelle, von oben nach unten verbinden. Analogwertvalidierung Nr. 7: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). Formeln Nr. 17/18 wie angegeben (statt UND: -1 = keine Aussage zählt nicht als „da“). UND Nr. 22: beide Eingänge negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Zustand (BLE)“: vorher einmal „+“ (V5). Statuszeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt."
SEITE1_SCHRITT7 = "Speichern und übertragen. Probe: „Zustand (BLE)“ zeigt „läuft – … Tags in Reichweite“; einen Anhänger aus dem Haus tragen – nach „Abwesend nach“ (30 s) und 2 Minuten zeigt „Anwesenheit (BLE)“ die andere Person bzw. „niemand zu Hause“."
SEITE2_H1 = "Nr. 11 bis 13: mit dem Plugin WiFi-Scanner NG und eingeschalteter Kopplung (Reiter Einstellungen, Zuordnung „Beispiel=Person1“) zählt auch das Telefon; ohne Kopplung zeigen sie die BLE-Anwesenheit (Quelle „ble“)."
SEITE2_H2 = "Nr. 15 nur mit mehreren LoxBerry-Scannern im Haus („Raumzuordnung aus mehreren Scannern bilden“); sonst weglassen."
SEITE2_H3 = "Nr. 17, 19, 21: jeder im Heimnetz kann über den UDP-Eingang des MQTT-Gateways Befehle senden – deshalb sind beide Haken im Plugin ab Werk aus. Die Quittung steht unter blescanner/befehl/&lt;Name&gt;/quittung; Nr. 22 zeigt das Ergebnis der Kalibrierung."
SEITE2_H4 = "Weitere Anhänger: dieselben Bausteine mit ihrem Alias."
SEITE2_SCHRITT1 = "Für die Entfernung im Plugin „Entfernung schätzen und veröffentlichen“ einschalten und den Anhänger einmal in 1 m Abstand kalibrieren (Nr. 18 oder Reiter Test „Auf 1 m kalibrieren“), den Wert am Tag als „ref“ eintragen; für die Batterie „Batteriestand über eine Verbindung lesen“ und am Tag „Batterie lesen“. Ohne das bleiben Nr. 5 und Nr. 6 auf -1 – die Seite funktioniert trotzdem."
SEITE2_SCHRITT2 = "Neue Seite, die Virtuellen Eingänge Nr. 1–6, 11 und 22 anlegen und ziehen (Name genau wie in der Tabelle); drei Virtuelle Texteingänge (Nr. 12, 14, 15), „In Visualisierung verwenden“ an."
SEITE2_SCHRITT3 = "Drei Tasten (Nr. 16, 18, 20) als Virtueller Eingang mit Eingangsart Taster; drei Befehle (Nr. 17, 19, 21) am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ – oder die Vorlage „MQTT-Befehle“ (grauer Knopf oben) importieren. Im Plugin „Befehle über MQTT annehmen“ einschalten, für den Batterielauf zusätzlich „Eingreifende Befehle über MQTT annehmen“."
SEITE2_SCHRITT4 = "Benachrichtigung „Meldung Batterie Schlüssel 1 schwach (BLE)“ anlegen."
SEITE2_SCHRITT5 = "Übrige Bausteine über F5. „+“: „Schlüssel 1 (BLE)“ zweimal (V5, V6)."
SEITE2_SCHRITT6 = "Speichern und übertragen. Probe: mit dem Anhänger durchs Haus gehen – die Signalstufe wechselt zwischen nah und mittel; „Testmodus Schlüssel 1“ drücken – im Plugin Reiter Test erscheinen die Einzelmessungen."
SEITE3_H1 = "Das Thermometer zählt im Plugin als Tag: „&lt;v4&gt; von &lt;v5&gt; Tags in Reichweite“ auf Seite „BLE-Scanner NG“ schließt es ein; die Anwesenheit (Personen) nicht."
SEITE3_H2 = "Andere Fühler (ATC/pvvx, RuuviTag, Eddystone, BTHome v2) liefern teils Luftdruck, Batteriespannung oder Helligkeit – gleiche Bauart, Eingang …_sensor_druck usw."
SEITE3_H3 = "Weitere Räume: je Thermometer dieselben Bausteine mit seinem Alias."
SEITE3_SCHRITT1 = "Im Plugin das Thermometer anhaken, Alias „thermometer_wohnzimmer“ (ohne „Person“ – sonst gilt es als Mensch); „Werbedaten dekodieren“ ist ab Werk an. Erst wenn es Werte gesendet hat (Reiter Einstellungen zeigt sie), stehen die Messwerte in der Namenstabelle."
SEITE3_SCHRITT2 = "Neue Seite, die 5 Virtuellen Eingänge anlegen und ziehen, dazu blescanner_server_online ein weiteres Mal; „Statistik“ an Temperatur und Feuchte einschalten."
SEITE3_SCHRITT3 = "Zwei Benachrichtigungen anlegen: „Meldung Batterie Thermometer schwach (BLE)“, „Meldung Thermometer verstummt (BLE)“."
SEITE3_SCHRITT4 = "Übrige Bausteine über F5. UND Nr. 11: Eingang I1 negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. „+“: Status einmal (V5)."
SEITE3_SCHRITT5 = "Speichern und übertragen. Probe: Temperatur in „Thermometer Wohnzimmer (BLE)“ mit der Anzeige am Thermometer vergleichen."
