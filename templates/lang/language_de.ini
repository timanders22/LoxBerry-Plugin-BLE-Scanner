ZU11 = "Zu #11 und #16 bis #18:"
ZU11_TEXT = "Die Ausfallerkennung hängt am Letzten Willen server_online (#1) und am Alter des Lebenszeichens server_ts (#3), nicht an server_ok (#2). server_ok ist flüchtig und steht nach einem harten Absturz des Dienstes in Loxone weiter auf 1. server_online setzt der Broker selbst auf 0, auch bei einem Absturz; ein zu altes Lebenszeichen fängt den Fall, dass der Dienst hängt, aber verbunden bleibt. server_ts kommt höchstens alle 30 Sekunden."
ZU12 = "Zu #12:"
ZU12_TEXT = "Ein Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang, sondern erst über ODER zusammenführen."
