Z1_12 = "Einschaltverzögerung | Störung bestätigt (BLE) | 600 s (das Lebenszeichen kommt alle 30 s, also zwanzig Lebenszeichen; ein Neustart des Dienstes oder des Miniservers meldet nichts) | Eingang = #11"
Z1_13 = "Benachrichtigung | Meldung Plugin gestört (BLE) | Text: BLE-Scanner NG – der Dienst meldet sich seit über 10 Minuten nicht oder hört kein Bluetooth (LoxBerry, MQTT-Gateway oder Bluetooth-Adapter). Solange gilt die Anwesenheit nicht, „Niemand zu Hause (BLE)“ schaltet nicht. In der App den Status „Zustand (BLE)“ lesen, im Plugin Reiter Test „Zustand des Dienstes“ | Eingang = #12"
