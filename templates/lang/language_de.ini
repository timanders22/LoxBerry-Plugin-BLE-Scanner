; BLE-Scanner NG - Sprachdatei (de)
; ERZEUGT von Werkzeuge/ble_sprache_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen entstehen aus derselben Tabelle; sie koennen deshalb nicht
; auseinanderlaufen. Wer einen Text aendert, aendert ihn dort.
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Umlaute stehen als direkte UTF-8-Zeichen: die Oberflaeche schickt jeden
; Wert durch bl_e(), eine Entitaet waere doppelt maskiert.

