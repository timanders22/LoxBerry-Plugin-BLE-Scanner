ZU13_TEXT = "Die wichtigste Zeile. Fällt der Dienst aus, melden über #19 alle Tags abwesend — ohne diese Verknüpfung löst das die volle Abwesenheitslogik aus."
ZU14 = "Zu #14:"
ZU14_TEXT = "Loxone rechnet in Sekunden seit dem 01.01.2009. Aus dem Zeitstempel wird die Dauer deshalb mit dem Zuschlag 1230768000 gebildet."
ZU19 = "Zu #19:"
ZU19_TEXT = "present gilt nur zusammen mit server_online. Stirbt der Dienst, bleibt der letzte Stand retained im Broker stehen; erst die Verknüpfung mit #1 macht daraus abwesend."
ZU7 = "Zu #7:"
ZU7_TEXT = "Die Ausschaltverzögerung kommt zusätzlich zur Einstellung Abwesend nach im Plugin. Beide zusammen ergeben die Gesamtzeit."

