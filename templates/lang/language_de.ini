[LOX]
BILD_ALT = "Bausteine der Seite „%s“ in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
HINWEISE_TITEL = "Hinweise"
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1 = "Schritt 1: Tags eintragen"
S1_TEXT = "Im Reiter Einstellungen, am einfachsten über Geräte suchen, anhaken und speichern. Ein Gerät, dessen Adresse als wechselnd angezeigt wird, taugt nicht."
S2 = "Schritt 2: Das Abo im MQTT-Gateway"
S2_TEXT = "Gateway V2: die Themen der Namenstabelle (unten) in den Subscriptions anhaken; server/ok zusätzlich „Noncached“, Taster (button) „Resetaftersend“."
S3 = "Schritt 3: Virtuelle Eingänge anlegen"
S3_TEXT = "Je Zeile der Namenstabelle einen Virtuellen Eingang (Zahl) bzw. Virtuellen Texteingang (Text) anlegen, Name genau wie in der Tabelle, „Als Digitaleingang“ nicht anhaken. Der LoxBerry-Benutzer braucht im Miniserver Rechte. Ein anderes Präfix oder ein anderer Alias heißt: alle Namen neu."
S4 = "Schritt 4: Kachel in der App"
S4_TEXT = "Den Status „Anwesenheit (BLE)“ von der Seite „BLE-Scanner NG“ (Schritt 7) als Kachel in die App legen: er nennt, wer zu Hause ist, und zeigt „unbekannt“, wenn der Scanner gestört ist. Wie viele Tags in Reichweite sind (summary_present), zeigt der Status „Zustand (BLE)“."
S5 = "Schritt 5: Ausfallerkennung"
S5_TEXT = "Virtuelle Eingänge behalten ihren letzten Wert. Fällt der Dienst aus, sieht in der App alles normal aus. Deshalb server_online auswerten – das setzt der Broker als Letzten Willen selbst auf 0 – und das Lebenszeichen status_zaehler mit einer Analogwertvalidierung (Tmc 120 s), denn es zählt höchstens alle 30 Sekunden weiter. server_ok taugt dafür nicht: es kommt nach einem harten Absturz nicht mehr. Die Anwesenheit (z. B. person_Person1_anwesend_gesamt) gilt nur zusammen mit server_online."
S6 = "Schritt 6: Anwesenheit entprellen"
S6_TEXT = "BLE-Tags senden nicht ununterbrochen. Ein einzelner verpasster Empfang darf keine Abwesenheit auslösen. Dafür gibt es im Plugin Abwesend nach, und in Loxone zusätzlich eine Ausschaltverzögerung. Der Reiter Verlauf nennt eine Zahl, sobald genug Daten da sind."
S7 = "Schritt 7: Befehle aus Loxone"
S7_TEXT = "Am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ je Befehl einen Virtuellen Ausgang Befehl mit dem Befehl bei EIN – oder die Vorlage MQTT-Befehle (grauer Knopf) importieren. Der Titel beginnt mit „BLE-Scanner NG:“ und gleicht damit keinem Gateway-Eingang."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"

