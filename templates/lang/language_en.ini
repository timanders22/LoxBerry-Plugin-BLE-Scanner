; BLE-Scanner NG - Sprachdatei (en)
; ERZEUGT von Werkzeuge/ble_sprache_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen entstehen aus derselben Tabelle; sie koennen deshalb nicht
; auseinanderlaufen. Wer einen Text aendert, aendert ihn dort.
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Umlaute stehen als direkte UTF-8-Zeichen: die Oberflaeche schickt jeden
; Wert durch bl_e(), eine Entitaet waere doppelt maskiert.

[ADRESSTYP]
FEST = "fixed"
STATISCH = "static random"
UNBEKANNT = "unknown"
WECHSELND = "rotating"

[ART]
ANALOG = "analog"
DIGITAL = "digital"
TEXT = "text"

[BAUSTEIN]
SEITE1_H1 = "<b>On no. 7:</b> virtual inputs keep their last value; only the standing sign of life reveals a hanging service. If no new value arrives within Tmc, the Value Validator reports at its output E – remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 9 and 17:</b> blescanner_server_online is the last will; blescanner_server_ok is not suitable for that, it no longer arrives after a hard crash."
SEITE1_H3 = "<b>On no. 15 to 18:</b> anwesend_gesamt always arrives – without the WiFi coupling it is the BLE presence (-1 = no statement). Switching the coupling on later needs no rewiring."
SEITE1_H4 = "<b>On no. 19 and 20:</b> the delay adds to the setting “Absent after” in the plugin; together they make up the total time."
SEITE1_H5 = "<b>On no. 21 and 22:</b> “Jemand zu Hause (BLE)” and “Niemand zu Hause (BLE)” are the finished switching signals. In your own project they replace the placeholders “Anwesenheit (eigene Quelle)” and “Niemand zu Hause (eigene Quelle)”: connect their consumers to no. 21 or 22, delete the placeholders. During a fault no. 22 stays at 0 – a dead detection must not trigger absence logic."
SEITE1_H6 = "A third person: input anwesend_gesamt, formula as no. 17, off delay as no. 19, then via a further OR (two inputs each) to no. 21."
SEITE1_H7 = "Other plugins do not read the presence from these inputs but from haus/anwesenheit/… (tab Settings “Provide presence for other plugins”, off by default)."
SEITE1_H8 = "The notifications come after 10 minutes of fault at the earliest; “Meldung Alle gegangen (BLE)” once per departure (and again after every transfer while nobody is there)."
SEITE1_SCHRITT1 = "In the plugin tab “Settings” → “Search for devices”, tick the key fobs (only devices with a fixed address – phones change their address; for them there is the tag type IRK), save. Set the additional settings per tag: “Alias” (e.g. schluessel1 – then the name in Loxone stays the same when the fob is replaced) and “Person” (e.g. Person1; several fobs of one person get the same name). Save."
SEITE1_SCHRITT2 = "Tab “MQTT”: “Publish states via MQTT” is on by default. Gateway V1: the plugin enters the subscription blescanner/# itself. Gateway V2: under System → MQTT Gateway → Subscriptions tick the topics of the name table (above), server/ok additionally “Noncached”."
SEITE1_SCHRITT3 = "In Loxone Config create one Virtual Input per input of the list (Periphery → Virtual Inputs), name exactly as in the column “Name” (or the name table above), do NOT tick “Use as digital input”; texts as Virtual Text Input. The LoxBerry user needs rights in the Miniserver. There is no template with Virtual HTTP Inputs any more."
SEITE1_SCHRITT4 = "Create the page “BLE-Scanner NG”, drag the 7 inputs of the list (no. 1–5, 15, 16), plus the constant 1 (no. 6)."
SEITE1_SCHRITT5 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (BLE)” and “Meldung Alle gegangen (BLE)”, texts as in the table."
SEITE1_SCHRITT6 = "Add the remaining blocks via the block search (F5), parameters as in the table, connect from top to bottom. Value Validator no. 7: remove the tick at ‘En’ in the properties window (Config creates En negated; otherwise the constant 1 arrives as 0). Formulas no. 17/18 as given (instead of AND: -1 = no statement does not count as “present”). AND no. 22: negate both inputs – click the input point, the input then shows a small circle. Status “Zustand (BLE)”: press “+” once beforehand (V5). Status rows in the given order, the one without condition last."
SEITE1_SCHRITT7 = "Save and transfer. Check: “Zustand (BLE)” shows “running – … tags in range”; carry a fob out of the house – after “Absent after” (30 s) and 2 minutes “Anwesenheit (BLE)” shows the other person or “nobody at home”."
SEITE2_H1 = "No. 11 to 13: with the plugin WiFi-Scanner NG and the coupling switched on (tab Settings, assignment “Beispiel=Person1”) the phone counts too; without coupling they show the BLE presence (source “ble”)."
SEITE2_H2 = "No. 15 only with several LoxBerry scanners in the house (“Build room assignment from several scanners”); otherwise leave it out."
SEITE2_H3 = "No. 17, 19, 21: anyone in the home network can send commands via the UDP input of the MQTT gateway – that is why both ticks in the plugin are off by default. The acknowledgement is under blescanner/befehl/&lt;name&gt;/quittung; no. 22 shows the result of the calibration."
SEITE2_H4 = "Further fobs: the same blocks with their alias."
SEITE2_SCHRITT1 = "For the distance switch on “Estimate and publish distance” in the plugin and calibrate the fob once at 1 m (no. 18 or tab Test “Calibrate at 1 m”), enter the value on the tag as “ref”; for the battery “Read battery level via a connection” and “Read battery” on the tag. Without that no. 5 and no. 6 stay at -1 – the page works anyway."
SEITE2_SCHRITT2 = "New page, create and drag the Virtual Inputs no. 1–6, 11 and 22 (name exactly as in the table); three Virtual Text Inputs (no. 12, 14, 15), “Use in visualisation” on."
SEITE2_SCHRITT3 = "Three push buttons (no. 16, 18, 20) as Virtual Input with input type push button; three commands (no. 17, 19, 21) at the common output “LoxBerry MQTT-Gateway” – or import the template “MQTT commands” (grey button above). In the plugin switch on “Accept commands via MQTT”, for the battery run additionally “Accept intervening commands via MQTT”."
SEITE2_SCHRITT4 = "Create the notification “Meldung Batterie Schlüssel 1 schwach (BLE)”."
SEITE2_SCHRITT5 = "Remaining blocks via F5. “+”: “Schlüssel 1 (BLE)” twice (V5, V6)."
SEITE2_SCHRITT6 = "Save and transfer. Check: walk through the house with the fob – the signal level changes between near and medium; press “Testmodus Schlüssel 1” – the single measurements appear in the plugin tab Test."
SEITE3_H1 = "The thermometer counts as a tag in the plugin: “&lt;v4&gt; of &lt;v5&gt; tags in range” on page “BLE-Scanner NG” includes it; the presence (persons) does not."
SEITE3_H2 = "Other sensors (ATC/pvvx, RuuviTag, Eddystone, BTHome v2) partly deliver air pressure, battery voltage or illuminance – same design, input …_sensor_druck etc."
SEITE3_H3 = "Further rooms: the same blocks per thermometer with its alias."
SEITE3_SCHRITT1 = "In the plugin tick the thermometer, alias “thermometer_wohnzimmer” (without “Person” – otherwise it counts as a human); “Decode advertising data” is on by default. Only once it has sent values (tab Settings shows them) do the measured values appear in the name table."
SEITE3_SCHRITT2 = "New page, create and drag the 5 Virtual Inputs, plus blescanner_server_online once more; switch on “Statistics” at temperature and humidity."
SEITE3_SCHRITT3 = "Create two notifications: “Meldung Batterie Thermometer schwach (BLE)”, “Meldung Thermometer verstummt (BLE)”."
SEITE3_SCHRITT4 = "Remaining blocks via F5. AND no. 11: negate input I1 – click the input point, the input then shows a small circle. “+”: status once (V5)."
SEITE3_SCHRITT5 = "Save and transfer. Check: compare the temperature in “Thermometer Wohnzimmer (BLE)” with the display on the thermometer."
Z1_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_server_online | 1 = the service is connected to the MQTT broker; the broker itself sets 0 as soon as the service drops out (last will, also after a crash, after about 90 s); retained; MQTT gateway version 2: tick (further instance on page “BLE-Scanner NG Messwerte”) | —"
Z1_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_status_zaehler | Sign of life: counts on by one at most every 30 s, 0 to 999, wraps around (never retained); version 2: tick | —"
Z1_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_server_ok | 1 = the service works and hears Bluetooth advertising; 0 = Bluetooth adapter off or blind; never retained; version 2: tick and “Noncached” | —"
Z1_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_summary_present | Number of active tags in range (thermometers count too); retained; version 2: tick | —"
Z1_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_summary_tags | Number of active tags; retained; version 2: tick | —"
Z1_06 = "Constant | Konstante 1 | value 1 | —"
Z1_07 = "Value Validator | Lebenszeichen fehlt (BLE) | Tmc 120 s (four signs of life without a new value), Min 0, Max 999; remove the tick at ‘En’ in the properties window | V = #2, En = #6"
Z1_08 = "NOT | Keine frischen Daten (BLE) | — (the service hears no Bluetooth advertising) | I = #3"
Z1_09 = "NOT | Dienst nicht verbunden (BLE) | — (last will of the broker) | I = #1"
Z1_10 = "OR | Dienst nicht verbunden oder Adapter blind (BLE) | — | I1 = #8, I2 = #9"
Z1_11 = "OR | Störung (BLE) | — (service gone, adapter blind or sign of life missing); immediately blocks “Niemand zu Hause (BLE)” | I1 = #10, I2 = output E of #7"
Z1_12 = "Switch-On Delay | Störung bestätigt (BLE) | 600 s (the sign of life arrives every 30 s, so twenty signs of life; a restart of the service or of the Miniserver reports nothing) | Input = #11"
Z1_13 = "Notification | Meldung Plugin gestört (BLE) | Text: BLE-Scanner NG – for more than 10 minutes the service has not reported or hears no Bluetooth (LoxBerry, MQTT gateway or Bluetooth adapter). Meanwhile presence is not valid, “Niemand zu Hause (BLE)” does not switch. Read the status “Zustand (BLE)” in the app, in the plugin tab Test “Service state” | Input = #12"
Z1_14 = "Status | Zustand (BLE) | Rows: V1 = 1 “the plugin has not reported for at least 2 minutes (no sign of life) – check LoxBerry and MQTT gateway (version 1: subscription blescanner/#, version 2: tick at blescanner/status/zaehler); in the plugin tab Test ‘Service state’, then ‘Restart service’”; V3 = 0 “the service is not connected to the MQTT broker – in the plugin tab Settings ‘Start service’; if that does not help, read the tab Log files”; V2 = 0 “the service runs but hears no Bluetooth – in the plugin tab Test ‘Check Bluetooth’, if needed ‘Switch Bluetooth on’”; V5 = 0 “no tag active – in the plugin tab Settings ‘Search for devices’, tick tags and save”; without condition “running – <v4> of <v5> tags in range”; visualisation ON | V1 = output E of #7, V2 = #3, V3 = #1, V4 = #4, V5 = #5"
Z1_15 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_person_Person1_anwesend_gesamt | 1 = person 1 at home (a tag with the additional setting “Person” = Person1 in range; with the WiFi coupling the phone counts too), 0 = away, -1 = no statement; always arrives, also without coupling; retained; only valid together with blescanner_server_online; version 2: tick (further instance on page “BLE-Scanner NG Tags”) | —"
Z1_16 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_person_Person2_anwesend_gesamt | the same for person 2 (additional setting “Person” = Person2); version 2: tick | —"
Z1_17 = "Formula | Person 1 da und Dienst online (BLE) | IF(I1>0;IF(I2>0;1;0);0) – only 1 counts as “present”, -1 (no statement) does not; if the service dies, “present” stays in the broker, only the last will turns it into “away” | I1 = #15, I2 = #1"
Z1_18 = "Formula | Person 2 da und Dienst online (BLE) | IF(I1>0;IF(I2>0;1;0);0) | I1 = #16, I2 = #1"
Z1_19 = "Switch-Off Delay | Person 1 da, entprellt (BLE) | 120 s, in addition to “Away after” in the plugin (default 30 s): a missed broadcast does not trigger absence; the more sparingly the fob sends, the longer (the plugin tab History gives a number) | Input = #17"
Z1_20 = "Switch-Off Delay | Person 2 da, entprellt (BLE) | 120 s | Input = #18"
Z1_21 = "OR | Jemand zu Hause (BLE) | — output Q replaces the placeholder “Anwesenheit (eigene Quelle)” in your own project (pages Saugroboter, Chromecast4lox, Abfahrtsassistent, cars): connect its consumers to this output, delete the placeholder; further persons via further OR blocks (two inputs each) in front | I1 = #19, I2 = #20"
Z1_22 = "AND | Niemand zu Hause (BLE) | — (I1 and I2 inverted: in Config click the input point, afterwards the input shows a small circle) 1 = everybody away AND the scanner is running; on a fault 0 – a dead detection switches no absence logic. Output Q replaces the placeholder “Niemand zu Hause (eigene Quelle)” in your own project (pages Alexa NG, Kodi-NG, Intercom, Ferien und Feiertage …) | I1 = #21 (inverted), I2 = #11 (inverted)"
Z1_23 = "Edge Detection | Erster ist gekommen (BLE) | Pd 1 s (default); output On = pulse when the first one comes home (e.g. welcome scene; not part of the list) | Input = #21"
Z1_24 = "Edge Detection | Letzter ist gegangen (BLE) | Pd 1 s (default); output On = pulse when the last one has left (e.g. central off; not part of the list) | Input = #22"
Z1_25 = "Formula | Wer ist da (BLE) | I1+2*I2 (0 = nobody, 1 = person 1, 2 = person 2, 3 = both) | I1 = #19, I2 = #20"
Z1_26 = "Status | Anwesenheit (BLE) | Rows: V3 = 1 “unknown – the BLE scanner is faulty; read the status ‘Zustand (BLE)’”; V2 = 1 “nobody at home”; V1 = 3 “person 1 and person 2 at home”; V1 = 1 “person 1 at home”; V1 = 2 “person 2 at home”; without condition “no statement”; visualisation ON | V1 = #25, V2 = #22, V3 = #11"
Z1_27 = "Notification | Meldung Alle gegangen (BLE) | Text: BLE-Scanner NG – nobody at home any more: all key fobs have been out of range for 2 minutes. Check windows, stove and lights | Input = #22"
Z2_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_present | 1 = key 1 in range (tag with alias “schluessel1”); retained; only valid together with blescanner_server_online; no further instance needed – the persons on page “BLE-Scanner NG” carry the presence; version 2: tick | —"
Z2_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_level | Signal level: 3 near (from -65 dBm), 2 medium (from -85 dBm), 1 weak, 0 gone; thresholds in the plugin tab Settings; retained; version 2: tick | —"
Z2_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_rssi_avg | smoothed signal strength in dBm; -255 = out of range (deliberately not -1, that would be at the strong end); never retained; version 2: tick | —"
Z2_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_last_seen | seconds since the last radio packet; -1 = never heard; never retained; version 2: tick | —"
Z2_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_distance | estimated distance in m; -1 = without reference value; only with “Estimate and publish distance” (tab Settings) and a reference value on the tag (no. 18–23 or tab Test “Calibrate at 1 m”); never retained; version 2: tick | —"
Z2_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_battery | Battery level in %% from the daily battery run (default 04:00); only with “Read battery level via a connection” and “Read battery” on the tag (some key finders beep then); -1 = never read or not readable; retained; version 2: tick | —"
Z2_07 = "Status | Schlüssel 1 (BLE) | Rows: V1 = 0 and V4 < 0 “never heard – check the alias in the plugin, then press ‘Testmodus Schlüssel 1’ (no. 16)”; V1 = 0 “out of range – last heard <v4> s ago”; V6 > 0 and V6 < 20 “in range, battery weak (<v6> %%) – replace the coin cell”; V2 = 3 and V5 > 0 “near – <v3> dBm, about <v5.1> m”; V2 = 3 “near – <v3> dBm”; V2 = 2 and V5 > 0 “medium distance – <v3> dBm, about <v5.1> m”; V2 = 2 “medium distance – <v3> dBm”; without condition “weak reception at the edge of the range – <v3> dBm”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5, V6 = #6"
Z2_08 = "Formula | Batterie Schlüssel 1 schwach (BLE) | IF(I1>0;IF(I1<20;1;0);0) – below 20 percent; -1 (never read) does not count | I1 = #6"
Z2_09 = "Switch-On Delay | Batterie Schlüssel 1 schwach bestätigt (BLE) | 600 s | Input = #8"
Z2_10 = "Notification | Meldung Batterie Schlüssel 1 schwach (BLE) | Text: BLE-Scanner NG – the battery of key 1 is below 20 percent. Replace the button cell, otherwise the presence of this fob will soon fail | Input = #9"
Z2_11 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_person_Person1_anwesend_gesamt | further instance of page “BLE-Scanner NG” no. 15: always arrives; with “Merge presence with the WiFi scanner” and the assignment “Beispiel=Person1” (the same name as wifi_ng_Beispiel on page “WiFi-Scanner-NG”) the phone counts too; 1 = present, 0 = away, -1 = no statement; switching the coupling on needs no rewiring | —"
Z2_12 = "Virtual Text Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_person_Person1_quelle | title exactly like this, “Use in visualisation” on; which source carries the statement: ble, wlan, ble+wlan or - ; always arrives (without coupling “ble”); retained; version 2: tick | —"
Z2_13 = "Status | Person 1 mit WLAN (BLE) | Rows: V1 = 1 “at home (detected via <v2>)”; V1 = 0 “away (according to <v2>)”; without condition “no statement – service disturbed or all sources silent”; visualisation ON | V1 = #11, V2 = #12"
Z2_14 = "Virtual Text Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_summary_names | title exactly like this, “Use in visualisation” on; names of the tags in range, separated by commas; empty when nobody is there; never retained; version 2: tick | —"
Z2_15 = "Virtual Text Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_raum | title exactly like this, “Use in visualisation” on; only with several scanners and “Build room assignment from several scanners”: name of the scanner with the strongest signal; “-” = no statement; retained; version 2: tick | —"
Z2_16 = "Virtual Input (push button) | Testmodus Schlüssel 1 | in the app; for 60 s every single measurement appears in the plugin tab Test (box “Test mode”) – for placing the LoxBerry or a fob | —"
Z2_17 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | BLE-Scanner NG: Testmodus Schlüssel 1 | Command on ON: publish blescanner/befehl/testmodus schluessel1 (never retain); after “testmodus ” enter the alias of your own tag; works only with the tick “Accept commands via MQTT” (plugin tab Settings) and a running service | Input = #16"
Z2_18 = "Virtual Input (push button) | Auf 1 m kalibrieren (Schlüssel 1) | in the app; place the fob exactly 1 m in front of the LoxBerry, then press – 10 s measurement | —"
Z2_19 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | BLE-Scanner NG: Kalibrieren Schlüssel 1 | Command on ON: publish blescanner/befehl/kalibrierung schluessel1 (never retain); alias as no. 17; result in the plugin tab Test and as no. 22; tick as no. 17 | Input = #18"
Z2_20 = "Virtual Input (push button) | Batterie jetzt lesen | in the app; reads the battery level of all tags with “Read battery” at once instead of at the set time; some key finders beep then | —"
Z2_21 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | BLE-Scanner NG: Batterielauf | Command on ON: publish blescanner/befehl/batterie 1 (never retain); works only with “Accept commands via MQTT” AND “Accept intervening commands via MQTT” as well as “Read battery level via a connection”; at most once per hour, otherwise the plugin acknowledges “abgelehnt” | Input = #20"
Z2_22 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_schluessel1_kalibrierung | Result of the last calibration: median of the signal strength in dBm; -255 = no measurement; arrives once after 10 s, never retained; version 2: tick | —"
Z2_23 = "Status | Kalibrierung Schlüssel 1 (BLE) | Rows: V1 < -254 “no measurement – fob closer to the LoxBerry, then ‘Calibrate at 1 m’ again”; V1 = 0 “not calibrated yet – press no. 18”; without condition “measured at 1 m: <v1> dBm – enter it on the tag in the plugin as reference value (ref), then no. 5 shows the distance”; visualisation ON | V1 = #22"
Z3_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_thermometer_wohnzimmer_present | 1 = the thermometer (tag with alias “thermometer_wohnzimmer”, e.g. Xiaomi MJ_HT_V1) is in range; retained; version 2: tick | —"
Z3_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_thermometer_wohnzimmer_sensor_temperatur | Temperature in °C from the radio packet, without pairing and without cloud; statistics on; never retained (measured value) – after a restart of the Miniserver the central reconnect fetches the last value from the gateway, otherwise 0 until the next radio packet; can replace the placeholder “Raumtemperatur Wohnzimmer (eigene Quelle)” (page Fensterbilanz) in your own project; version 2: tick | —"
Z3_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_thermometer_wohnzimmer_sensor_feuchte | relative humidity in %% from the radio packet; statistics on; never retained; version 2: tick | —"
Z3_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_thermometer_wohnzimmer_sensor_batterie | Battery level in %%; arrives in its own, rarer radio packets; 0 = not heard yet; never retained; version 2: tick | —"
Z3_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_thermometer_wohnzimmer_last_seen | seconds since the last radio packet; -1 = never heard; never retained; version 2: tick | —"
Z3_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin BLE-Scanner NG) | blescanner_server_online | 1 = the service is connected (further instance of page “BLE-Scanner NG” no. 1) | —"
Z3_07 = "Status | Thermometer Wohnzimmer (BLE) | Rows: V1 = 0 and V5 < 0 “never heard – check the alias in the plugin, move the thermometer closer to the LoxBerry”; V1 = 0 “nothing heard for <v5> s – values outdated; check battery and distance to the LoxBerry”; V4 > 0 and V4 < 20 “<v2.1> °C, <v3.0> %% RH – battery weak (<v4> %%)”; without condition “<v2.1> °C, <v3.0> %% RH, battery <v4> %%”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5"
Z3_08 = "Formula | Batterie Thermometer schwach (BLE) | IF(I1>0;IF(I1<20;1;0);0) – below 20 percent; 0 (not heard yet) does not count | I1 = #4"
Z3_09 = "Switch-On Delay | Batterie Thermometer schwach bestätigt (BLE) | 600 s | Input = #8"
Z3_10 = "Notification | Meldung Batterie Thermometer schwach (BLE) | Text: BLE-Scanner NG – the battery of the thermometer in the living room is below 20 percent. Replace the battery before the values stop | Input = #9"
Z3_11 = "AND | Thermometer verstummt (BLE) | — (I1 inverted: in Config click the input point, afterwards the input shows a small circle) only while the service is running – a failure of the scanner already reports “Meldung Plugin gestört (BLE)” | I1 = #1 (inverted), I2 = #6"
Z3_12 = "Switch-On Delay | Thermometer verstummt bestätigt (BLE) | 1800 s (the thermometer sends every few seconds; half an hour bridges radio gaps) | Input = #11"
Z3_13 = "Notification | Meldung Thermometer verstummt (BLE) | Text: BLE-Scanner NG – nothing has come from the thermometer in the living room for 30 minutes; temperature and humidity are outdated. Check the battery, reduce the distance to the LoxBerry; read the status “Thermometer Wohnzimmer (BLE)” in the app | Input = #12"

[BEFEHL]
K_BATTERIE = "Battery run"
K_KALIBRIERUNG = "Calibration 1 m"
K_TESTMODUS = "Test mode"
M_ANGEHALTEN = "Command bridge stopped (%s)."
M_GESPEICHERT = "Saved. The service keeps running unchanged (only the ticks of the command bridge were changed)."
M_GESTARTET = "Command bridge started (%s)."
M_START_FEHL = "The command bridge could not be started (%s) – the watchdog retries within a minute; tab Test names the reason."
M_STOP_FEHL = "The command bridge could not be stopped (%s)."
T_ARCHIV = "no statement – not installed."
T_AUS = "off – “Accept commands via MQTT” is not ticked (default)."
T_DEFEKT = "Command bridge assignment faulty: %s"
T_EINRICHTUNG = "(mosquitto-clients is one of the plugin packages; check again after an update)"
T_FEHLT = "bin/befehlsbruecke.php is missing or cannot be loaded."
T_HAENGT = "the command bridge has not reported for %d s."
T_LAEUFT = "running since %s; accepted %d, rejected %d; last %s"
T_OHNE_ABO = "the command bridge runs without a subscription at the broker: %s"
T_PRAEFIX = "Prefix %s is valid for the command bridge."
T_PRAEFIX_FALSCH = "Prefix %s is not valid for the command bridge (at most 40 characters per level) – commands do not arrive."
T_STEHT = "Tick on, but the command bridge is not running – the watchdog (cron.01min) starts it within a minute."
