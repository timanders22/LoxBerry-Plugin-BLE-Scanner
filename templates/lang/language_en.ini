HINWEISE_TITEL = "Notes"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1 = "Step 1: enter the tags"
S1_TEXT = "In the Settings tab, easiest via Search for devices, tick and save. A device whose address is shown as rotating is unsuitable."
S2 = "Step 2: the subscription in the MQTT gateway"
S3 = "Step 3: create the virtual inputs"
S3_TEXT = "Fastest via the template below. Created by hand, an input is named exactly like the topic, with underscores instead of slashes."
S4 = "Step 4: tile in the app"
S4_TEXT = "Put the status “Anwesenheit (BLE)” from the page “BLE-Scanner NG” (step 7) into the app as a tile: it says who is at home and shows “unknown” when the scanner is faulty. How many tags are in range (summary_present) is shown by the status “Zustand (BLE)”."
S5 = "Step 5: failure detection"
S5_TEXT = "Virtual inputs keep their last value. If the service fails, everything looks normal in the app. Therefore evaluate server_online — the broker sets it to 0 itself as the last will — and the sign of life server_ts with a value validator, because it arrives anew at most every 30 seconds. server_ok is not suitable: it stays at 1 after a hard crash. Presence (present) is only valid while server_online is 1. Fully connected on the page “BLE-Scanner NG” in step 7 (“Störung (BLE)”, “Zustand (BLE)”)."
S6 = "Step 6: debounce presence"
S6_TEXT = "BLE tags do not transmit continuously. A single missed reception must not trigger absence. The plugin has the away delay for that, and Loxone an additional switch off delay. The History tab suggests a number once there is enough data."
SCHRITTE_TITEL = "How to take over this page"

