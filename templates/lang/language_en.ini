; BLE-Scanner NG - Sprachdatei (en)
; ERZEUGT von Werkzeuge/ble_sprache_erzeugen.py - nicht von Hand aendern.
; Beide Sprachen entstehen aus derselben Tabelle; sie koennen deshalb nicht
; auseinanderlaufen. Wer einen Text aendert, aendert ihn dort.
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Umlaute stehen als direkte UTF-8-Zeichen: die Oberflaeche schickt jeden
; Wert durch bl_e(), eine Entitaet waere doppelt maskiert.

[ADRESSTYP]
FEST = "fixed"
STATISCH = "static random"
UNBEKANNT = "unknown"
WECHSELND = "rotating"

[ART]
ANALOG = "analog"
DIGITAL = "digital"
TEXT = "text"

[BAUSTEIN]
SEITE1_H1 = "<b>On no. 7:</b> virtual inputs keep their last value; only the standing sign of life gives away a hanging service. If no new value arrives within Tmc, the value validator reports at its output E – remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 9 and 17:</b> blescanner_server_online is the last will; blescanner_server_ok is not suitable, it stays at 1 after a hard crash."
SEITE1_H3 = "<b>On no. 19 and 20:</b> the delay comes on top of the setting “Away after” in the plugin; both together make up the total time."
SEITE1_H4 = "<b>On no. 21 and 22:</b> “Jemand zu Hause (BLE)” and “Niemand zu Hause (BLE)” are the finished switching signals. In your own project they replace the placeholders “Anwesenheit (eigene Quelle)” and “Niemand zu Hause (eigene Quelle)”: connect their consumers to no. 21 or 22, delete the placeholders."
SEITE1_H5 = "<b>On no. 22:</b> on a fault “Niemand zu Hause (BLE)” stays 0 – a dead detection must not trigger absence logic; heating and alarm system then do not go into absence mode."
SEITE1_H6 = "A third person: input, AND with no. 1, switch-off delay like no. 15/17/19, then via a further OR (two inputs each) to no. 21."
SEITE1_H7 = "The values only arrive if the MQTT gateway passes them to the Miniserver via HTTP (names with “_”); in UDP mode the template does not fit."
SEITE1_H8 = "The messages come at the earliest after 10 minutes of fault; “Meldung Alle gegangen (BLE)” once per departure (and again after every transfer as long as nobody is there)."
SEITE1_SCHRITT1 = "In the plugin tab “Settings” → “Search for devices”, tick the key fobs (only devices with a fixed address – phones change their address), save. Set the additional fields per tag: “Alias” (e.g. schluessel1 – then the name in Loxone stays the same when the fob is replaced) and “Person” (e.g. Person1; several fobs of one person get the same name). Save."
SEITE1_SCHRITT2 = "Tab “MQTT”: “Publish states via MQTT” is on by default. The plugin enters the subscription blescanner/# itself (gateway V1); with gateway V2 the group appears under System → MQTT Gateway → Subscriptions, tick the values there."
SEITE1_SCHRITT3 = "Let every fob send once, then in this tab “Create template for Loxone Config” (further up). In Loxone Config: Periphery → Virtual Inputs → import template. Import only ONCE (twice gives duplicate inputs); after new tags create missing inputs by hand, name exactly like the gateway name. The template serves all three pages."
SEITE1_SCHRITT4 = "Create the page “BLE-Scanner NG”, drag the 7 inputs of the list from the container “BLE-Scanner NG” (no. 1–5, 15, 16), plus the constant 1 (no. 6). If the person inputs are missing (plugin up to 1.3.23), create the two inputs by hand: Virtual Input, name exactly blescanner_person_Person1_present or blescanner_person_Person2_present."
SEITE1_SCHRITT5 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (BLE)” and “Meldung Alle gegangen (BLE)”, texts as in the table."
SEITE1_SCHRITT6 = "Remaining blocks via the block search (F5), parameters as in the table, connect from top to bottom. Value Validator no. 7: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0). AND no. 22: invert both inputs – click the input point, afterwards the input shows a small circle. Status “Zustand (BLE)”: first click “+” once (V5). Status rows in the given order, the one without condition last."
SEITE1_SCHRITT7 = "Save and transfer. Check: “Zustand (BLE)” shows “läuft – … Tags in Reichweite”; carry a fob out of the house – after “Away after” (30 s) and 2 minutes “Anwesenheit (BLE)” shows the other person or “niemand zu Hause”."
SEITE2_H1 = "No. 11 to 13 only with the plugin WiFi-Scanner NG and the coupling switched on (tab Settings, assignment “Beispiel=Person1”). Then the phone counts too; connect this input on page “BLE-Scanner NG” to the AND no. 17 instead of blescanner_person_Person1_present."
SEITE2_H2 = "No. 15 only with several LoxBerry scanners in the house (“Build room assignment from several scanners”); otherwise leave it out."
SEITE2_H3 = "Further fobs: the same blocks with their alias."
SEITE2_SCHRITT1 = "Container from page “BLE-Scanner NG”, step 3 (do not import again). For the distance switch on “Estimate and publish distance” in the plugin and once “Calibrate at 1 m” with the fob at 1 m (tab Test); for the battery “Read battery level via a connection” and “Read battery” on the tag. Without that no. 5 stays at -1 and no. 6 at 0 – the page works anyway."
SEITE2_SCHRITT2 = "New page, drag the 7 inputs (no. 1–6, 11). Create three Virtual Text Inputs by hand, name exactly as in the table, “Use in visualisation” on."
SEITE2_SCHRITT3 = "Create the notification “Meldung Batterie Schlüssel 1 schwach (BLE)”."
SEITE2_SCHRITT4 = "Remaining blocks via F5. “+”: “Schlüssel 1 (BLE)” twice (V5, V6)."
SEITE2_SCHRITT5 = "Save and transfer. Check: walk through the house with the fob – the signal level changes between near and medium."
SEITE3_H1 = "The thermometer counts as a tag in the plugin: “&lt;v4&gt; von &lt;v5&gt; Tags in Reichweite” on page “BLE-Scanner NG” includes it; the presence (persons) does not."
SEITE3_H2 = "Other sensors (ATC/pvvx, RuuviTag, Eddystone) partly deliver air pressure or battery voltage – same design, input …_sensor_druck etc."
SEITE3_H3 = "Further rooms: per thermometer the same blocks with its alias."
SEITE3_SCHRITT1 = "Tick the thermometer in the plugin, alias “thermometer_wohnzimmer” (without “Person” – otherwise it counts as a human); “Decode advertising data” is on by default. Only when it has sent values (tab Settings shows them) fetch the template again – before that the measurement inputs are missing (or create them by hand, name exactly as in the table)."
SEITE3_SCHRITT2 = "New page, drag the 6 inputs (blescanner_server_online once more); switch on “Statistics” at temperature and humidity."
SEITE3_SCHRITT3 = "Create two notifications: “Meldung Batterie Thermometer schwach (BLE)”, “Meldung Thermometer verstummt (BLE)”."
SEITE3_SCHRITT4 = "Remaining blocks via F5. AND no. 11: invert input I1 – click the input point, afterwards the input shows a small circle. “+”: status once (V5)."
SEITE3_SCHRITT5 = "Save and transfer. Check: compare the temperature in “Thermometer Wohnzimmer (BLE)” with the display on the thermometer."
Z1_01 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_server_online | 1 = the service is connected to the MQTT broker; the broker itself sets 0 as soon as the service drops out (also after a crash, after about 90 s); comes via the MQTT gateway (title = gateway name) | —"
Z1_02 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_server_ts | Sign of life: time of the last evaluation run, arrives anew at most every 30 s | —"
Z1_03 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_server_ok | 1 = the service is working and hears Bluetooth advertising; 0 = Bluetooth adapter off or blind | —"
Z1_04 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_summary_present | Number of active tags in range (thermometers count too) | —"
Z1_05 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_summary_tags | Number of active tags | —"
Z1_06 = "Constant | Konstante 1 | value 1 | —"
Z1_07 = "Value Validator | Lebenszeichen fehlt (BLE) | Tmc 120 s (four signs of life without a new value), Min 0, Max 2147483647; remove the tick at ‘En’ in the properties window | V = #2, En = #6"
Z1_08 = "NOT | Keine frischen Daten (BLE) | — (the service hears no Bluetooth advertising) | I = #3"
Z1_09 = "NOT | Dienst nicht verbunden (BLE) | — (last will of the broker) | I = #1"
Z1_10 = "OR | Dienst nicht verbunden oder Adapter blind (BLE) | — | I1 = #8, I2 = #9"
Z1_11 = "OR | Störung (BLE) | — (service gone, adapter blind or sign of life missing); immediately blocks “Niemand zu Hause (BLE)” | I1 = #10, I2 = output E of #7"
Z1_12 = "Switch-On Delay | Störung bestätigt (BLE) | 600 s (the sign of life arrives every 30 s, so twenty signs of life; a restart of the service or of the Miniserver reports nothing) | Input = #11"
Z1_13 = "Notification | Meldung Plugin gestört (BLE) | Text: BLE-Scanner NG – for more than 10 minutes the service has not reported or hears no Bluetooth (LoxBerry, MQTT gateway or Bluetooth adapter). Meanwhile presence is not valid, “Niemand zu Hause (BLE)” does not switch. Read the status “Zustand (BLE)” in the app, in the plugin tab Test “Service state” | Input = #12"
Z1_14 = "Status | Zustand (BLE) | Rows: V1 = 1 “the plugin has not reported for at least 2 minutes (no sign of life) – check LoxBerry and MQTT gateway (subscription blescanner/#); in the plugin tab Test ‘Service state’, then ‘Restart service’”; V3 = 0 “the service is not connected to the MQTT broker – in the plugin tab Settings ‘Start service’; if that does not help, read the tab Log files”; V2 = 0 “the service is running but hears no Bluetooth – in the plugin tab Test ‘Check Bluetooth’, if needed ‘Switch Bluetooth on’”; V5 = 0 “no tag active – in the plugin tab Settings ‘Search for devices’, tick tags and save”; without condition “running – <v4> of <v5> tags in range”; visualisation ON | V1 = output E of #7, V2 = #3, V3 = #1, V4 = #4, V5 = #5"
Z1_15 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_person_Person1_present | 1 = at least one tag of person 1 is in range (in the plugin the additional field “Person” = Person1 on the tag); only valid together with blescanner_server_online | —"
Z1_16 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_person_Person2_present | the same for person 2 (additional field “Person” = Person2) | —"
Z1_17 = "AND | Person 1 da und Dienst online (BLE) | — (if the service dies, “present” stays in the broker; only the last will turns it into “away”) | I1 = #15, I2 = #1"
Z1_18 = "AND | Person 2 da und Dienst online (BLE) | — | I1 = #16, I2 = #1"
Z1_19 = "Switch-Off Delay | Person 1 da, entprellt (BLE) | 120 s, in addition to “Away after” in the plugin (default 30 s): a missed broadcast does not trigger absence; the more sparingly the fob sends, the longer (the plugin tab History gives a number) | Input = #17"
Z1_20 = "Switch-Off Delay | Person 2 da, entprellt (BLE) | 120 s | Input = #18"
Z1_21 = "OR | Jemand zu Hause (BLE) | — output Q replaces the placeholder “Anwesenheit (eigene Quelle)” in your own project (pages Saugroboter, Chromecast4lox, Abfahrtsassistent, cars): connect its consumers to this output, delete the placeholder; further persons via further OR blocks (two inputs each) in front | I1 = #19, I2 = #20"
Z1_22 = "AND | Niemand zu Hause (BLE) | — (I1 and I2 inverted: in Config click the input point, afterwards the input shows a small circle) 1 = everybody away AND the scanner is running; on a fault 0 – a dead detection switches no absence logic. Output Q replaces the placeholder “Niemand zu Hause (eigene Quelle)” in your own project (pages Alexa NG, Kodi-NG, Intercom, Ferien und Feiertage …) | I1 = #21 (inverted), I2 = #11 (inverted)"
Z1_23 = "Edge Detection | Erster ist gekommen (BLE) | Pd 1 s (default); output On = pulse when the first one comes home (e.g. welcome scene; not part of the list) | Input = #21"
Z1_24 = "Edge Detection | Letzter ist gegangen (BLE) | Pd 1 s (default); output On = pulse when the last one has left (e.g. central off; not part of the list) | Input = #22"
Z1_25 = "Formula | Wer ist da (BLE) | I1+2*I2 (0 = nobody, 1 = person 1, 2 = person 2, 3 = both) | I1 = #19, I2 = #20"
Z1_26 = "Status | Anwesenheit (BLE) | Rows: V3 = 1 “unknown – the BLE scanner is faulty; read the status ‘Zustand (BLE)’”; V2 = 1 “nobody at home”; V1 = 3 “person 1 and person 2 at home”; V1 = 1 “person 1 at home”; V1 = 2 “person 2 at home”; without condition “no statement”; visualisation ON | V1 = #25, V2 = #22, V3 = #11"
Z1_27 = "Notification | Meldung Alle gegangen (BLE) | Text: BLE-Scanner NG – nobody at home any more: all key fobs have been out of range for 2 minutes. Check windows, stove and lights | Input = #22"
Z2_01 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_present | 1 = key 1 in range (tag with alias “schluessel1”); only valid together with blescanner_server_online; no further instance needed – the persons on page “BLE-Scanner NG” carry the presence | —"
Z2_02 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_level | Signal level: 3 near (from -65 dBm), 2 medium (from -85 dBm), 1 weak, 0 gone; thresholds in the plugin tab Settings | —"
Z2_03 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_rssi_avg | smoothed signal strength in dBm; -255 = out of range | —"
Z2_04 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_last_seen | Seconds since the last broadcast; -1 = never heard | —"
Z2_05 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_distance | estimated distance in m; -1 = without reference value; only with “Estimate and publish distance” (tab Settings) and once “Calibrate at 1 m” (tab Test) | —"
Z2_06 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_schluessel1_battery | Battery level in %% from the daily battery run (default 04:00); only with “Read battery level via a connection” and “Read battery” on the tag (some key finders beep doing so); 0 = never read | —"
Z2_07 = "Status | Schlüssel 1 (BLE) | Rows: V1 = 0 “out of range – last heard <v4> s ago; battery <v6> %%”; V2 = 3 “near – <v3> dBm, about <v5.1> m; battery <v6> %%”; V2 = 2 “medium distance – <v3> dBm, about <v5.1> m; battery <v6> %%”; without condition “weak reception at the edge of the range – <v3> dBm; battery <v6> %%”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5, V6 = #6"
Z2_08 = "Formula | Batterie Schlüssel 1 schwach (BLE) | IF(I1>0;IF(I1<20;1;0);0) – below 20 percent; 0 (never read) does not count | I1 = #6"
Z2_09 = "Switch-On Delay | Batterie Schlüssel 1 schwach bestätigt (BLE) | 600 s | Input = #8"
Z2_10 = "Notification | Meldung Batterie Schlüssel 1 schwach (BLE) | Text: BLE-Scanner NG – the battery of key 1 is below 20 percent. Replace the button cell, otherwise the presence of this fob will soon fail | Input = #9"
Z2_11 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_person_Person1_anwesend_gesamt | only with “Merge presence with the WiFi scanner” and the assignment “Beispiel=Person1” (the same name as wifi_ng_Beispiel on page “WiFi-Scanner-NG”): 1 = key or phone at home, 0 = both gone, “-” = no statement; whoever uses the coupling connects this input on page “BLE-Scanner NG” instead of blescanner_person_Person1_present to no. 17 | —"
Z2_12 = "Virtual Text Input | blescanner_person_Person1_quelle | create by hand, name exactly like this (name assigned by the MQTT gateway), “Use in visualisation” on; which source carries the statement: ble, wlan, ble+wlan or - ; only with coupling | —"
Z2_13 = "Status | Person 1 mit WLAN (BLE) | Rows: V1 = 1 “at home (detected via <v2>)”; without condition “away or no statement – coupling off in the plugin or both sources silent”; visualisation ON | V1 = #11, V2 = #12"
Z2_14 = "Virtual Text Input | blescanner_summary_names | create by hand, name exactly like this, “Use in visualisation” on; names of the tags in range, separated by commas; empty when nobody is there | —"
Z2_15 = "Virtual Text Input | blescanner_schluessel1_raum | create by hand, name exactly like this, “Use in visualisation” on; only with several scanners and “Build room assignment from several scanners”: name of the scanner with the strongest signal; “-” = no statement | —"
Z3_01 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_thermometer_wohnzimmer_present | 1 = the thermometer (tag with alias “thermometer_wohnzimmer”, e.g. Xiaomi MJ_HT_V1) is in range | —"
Z3_02 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_thermometer_wohnzimmer_sensor_temperatur | Temperature in °C from the broadcast, without pairing and without cloud; statistics on; after a Miniserver restart 0 until the next broadcast; can replace the placeholder “Raumtemperatur Wohnzimmer (eigene Quelle)” (page Fensterbilanz) in your own project | —"
Z3_03 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_thermometer_wohnzimmer_sensor_feuchte | relative humidity in %% from the broadcast; statistics on | —"
Z3_04 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_thermometer_wohnzimmer_sensor_batterie | Battery level in %%; arrives in separate, rarer broadcasts; 0 = not heard yet | —"
Z3_05 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_thermometer_wohnzimmer_last_seen | Seconds since the last broadcast; -1 = never heard | —"
Z3_06 = "Virtual HTTP Input Command (template “BLE-Scanner NG”) | blescanner_server_online | 1 = the service is connected (further instance, the same command as on page “BLE-Scanner NG”) | —"
Z3_07 = "Status | Thermometer Wohnzimmer (BLE) | Rows: V1 = 0 “nothing heard for <v5> s – values outdated; check battery and distance to the LoxBerry”; V4 > 0 and V4 < 20 “<v2.1> °C, <v3.0> %% RH – battery weak (<v4> %%)”; without condition “<v2.1> °C, <v3.0> %% RH, battery <v4> %%”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5"
Z3_08 = "Formula | Batterie Thermometer schwach (BLE) | IF(I1>0;IF(I1<20;1;0);0) – below 20 percent; 0 (not heard yet) does not count | I1 = #4"
Z3_09 = "Switch-On Delay | Batterie Thermometer schwach bestätigt (BLE) | 600 s | Input = #8"
Z3_10 = "Notification | Meldung Batterie Thermometer schwach (BLE) | Text: BLE-Scanner NG – the battery of the thermometer in the living room is below 20 percent. Replace the battery before the values stop | Input = #9"
Z3_11 = "AND | Thermometer verstummt (BLE) | — (I1 inverted: in Config click the input point, afterwards the input shows a small circle) only while the service is running – a failure of the scanner already reports “Meldung Plugin gestört (BLE)” | I1 = #1 (inverted), I2 = #6"
Z3_12 = "Switch-On Delay | Thermometer verstummt bestätigt (BLE) | 1800 s (the thermometer sends every few seconds; half an hour bridges radio gaps) | Input = #11"
Z3_13 = "Notification | Meldung Thermometer verstummt (BLE) | Text: BLE-Scanner NG – nothing has come from the thermometer in the living room for 30 minutes; temperature and humidity are outdated. Check the battery, reduce the distance to the LoxBerry; read the status “Thermometer Wohnzimmer (BLE)” in the app | Input = #12"

