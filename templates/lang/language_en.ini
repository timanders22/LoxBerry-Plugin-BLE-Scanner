WAS_IST_DAS = "<b>Presence via Bluetooth Low Energy for the Loxone Miniserver.</b> The service listens through BlueZ for the radio signals of BLE devices in range and reports for every registered tag, such as a key fob, whether it is present – together with signal strength and, where the device sends them, temperature, humidity and battery level. The values reach the Miniserver over MQTT and, on request, additionally over HTTP to virtual inputs."
WECHSELNDE_WARNUNG = "Devices with rotating addresses (phones, watches, headphones) are unsuitable for presence detection: the stored address is only valid until the next change, typically a quarter of an hour."
WEG_ZUM_MINISERVER = "Path to the Miniserver"
WLAN_HILFE = "Combines, per person, the presence from this plugin and from the plugin WiFi-Scanner NG. Only its MQTT topics are read: wifi_ng/<Name> (0/1), the heartbeat wifi_ng/status/ts and wifi_ng/status/ok. The WiFi scanner only sends via MQTT when UDP is switched off there. Sent are person/<Person>/anwesend_gesamt (1 if one source says present; 0 if both say away; - without a statement) and person/<Person>/quelle (ble, wlan, ble+wlan or -), both retained. If the WiFi scanner is silent for longer than three times its interval (at least 3 minutes), only BLE counts – the Test tab says so."
WLAN_UEBERSCHRIFT = "Presence with the WiFi scanner (off by default)"
WLAN_ZUORDNUNG_HILFE = "One pair WiFi-name=person per person, separated by commas, e.g. Anna_Phone=Anna. On the left the name under which the WiFi scanner sends the person (wifi_ng/Anna_Phone), on the right the name from the Person option of the tags (topic person/Anna/present). Letters, digits, hyphen and underscore are allowed; each name at most once, at most 20 pairs."
