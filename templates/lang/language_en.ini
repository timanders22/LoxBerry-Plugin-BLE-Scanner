[LOX]
BILD_ALT = "Blocks of the page “%s” in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
HINWEISE_TITEL = "Notes"
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1 = "Step 1: enter the tags"
S1_TEXT = "In the Settings tab, easiest via Search for devices, tick and save. A device whose address is shown as rotating is unsuitable."
S2 = "Step 2: the subscription in the MQTT gateway"
S2_TEXT = "Gateway V2: tick the topics of the name table (below) in the subscriptions; server/ok additionally “Noncached”, push buttons (button) “Resetaftersend”."
S3 = "Step 3: create the virtual inputs"
S3_TEXT = "Create one Virtual Input (number) or Virtual Text Input (text) per row of the name table, name exactly as in the table, do not tick “Use as digital input”. The LoxBerry user needs rights in the Miniserver. A different prefix or alias means: all names new."
S4 = "Step 4: tile in the app"
S4_TEXT = "Put the status “Anwesenheit (BLE)” from the page “BLE-Scanner NG” (step 7) into the app as a tile: it says who is at home and shows “unknown” when the scanner is faulty. How many tags are in range (summary_present) is shown by the status “Zustand (BLE)”."
S5 = "Step 5: failure detection"
S5_TEXT = "Virtual inputs keep their last value. If the service fails, everything looks normal in the app. Therefore evaluate server_online – the broker itself sets it to 0 as last will – and the sign of life status_zaehler with a Value Validator (Tmc 120 s), as it counts on at most every 30 seconds. server_ok is not suitable for that: it no longer arrives after a hard crash. The presence (e.g. person_Person1_anwesend_gesamt) is only valid together with server_online."
S6 = "Step 6: debounce presence"
S6_TEXT = "BLE tags do not transmit continuously. A single missed reception must not trigger absence. The plugin has the away delay for that, and Loxone an additional switch off delay. The History tab suggests a number once there is enough data."
S7 = "Step 7: Commands from Loxone"
S7_TEXT = "At the common output “LoxBerry MQTT-Gateway” one Virtual Output Command per command with the command on ON – or import the template MQTT commands (grey button). The title starts with “BLE-Scanner NG:” and thus matches no gateway input."
SCHRITTE_TITEL = "How to take over this page"

