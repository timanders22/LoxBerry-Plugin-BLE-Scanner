RETAIN_ERKLAERUNG = "Retain means the broker keeps the last value and hands it to every new subscriber immediately. States are sent that way so that Loxone has the situation after a Miniserver restart. Time-related measurements are not — otherwise an old value would appear current after an outage. The heartbeat server/ts never is: retained it would claim forever that the service is alive. Neither is anything the service says about itself (server/ok, server/adapter_ok). server/online is the last will: 1 on connecting, 0 is set by the broker itself when the service drops out; uninstalling clears the topic."
