; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "BLE-Scanner NG"
K02 = "Erkennt Bluetooth-Low-Energy-Geräte in Reichweite und meldet dem Loxone Miniserver, ob ein hinterlegter Tag anwesend ist — samt Signalstärke, Zeitstempel und, wo das Gerät sie mitsendet, Temperatur, Luftfeuchte und Batteriestand. Typischer Einsatz: Schlüsselanhänger als Anwesenheitserkennung."
K03 = "In vier Schritten eingerichtet"
K04 = "Reiter <i>Einstellungen</i> → <i>Geräte suchen</i>. Der gesuchte Tag sollte dabei in der Nähe liegen. Die Spalte <i>Adresstyp</i> sagt sofort, ob das Gerät überhaupt taugt."
K05 = "Gefundenes Gerät anhaken, eine Bezeichnung vergeben und speichern."
K06 = "Reiter <i>MQTT</i> → das Abo <tt>&lt;Präfix&gt;/#</tt>. <b>Gilt für MQTT&#8209;Gateway&nbsp;V1:</b> seit 1.3.20 trägt das Plugin es selbst in seine Abo-Datei <tt>config/plugins/&lt;Ordner&gt;/mqtt_subscriptions.cfg</tt> ein, die das Gateway liest - beim Dienststart und beim Speichern im Reiter MQTT; von Hand ist nichts einzutragen. Ab Fassung&nbsp;2 erscheint die Themengruppe von selbst in den Subscriptions."
K07 = "Reiter <i>Einbindung in Loxone</i> → je Zeile der Namenstabelle einen Virtuellen Eingang anlegen (Name genau so, wie das MQTT-Gateway ihn vergibt), danach die drei Baustein-Listen aus dem LoxBerry-Plugins Musterprojekt von oben nach unten abarbeiten – je Seite mit Anleitung, Hinweisen und Bild. Eine Vorlage mit Virtuellen HTTP-Eingängen gibt es seit 1.3.28 nicht mehr."
K08 = "Nicht jedes Gerät taugt dazu"
K09 = "Mobiltelefone, Uhren und Kopfhörer <b>wechseln ihre Bluetooth-Adresse regelmäßig</b> — oft alle 15 Minuten. Das ist eine Datenschutzfunktion und lässt sich nicht abschalten. Solche Geräte sind zur Anwesenheitserkennung unbrauchbar: die eingetragene Adresse gilt nur bis zum nächsten Wechsel."
K10 = "Seit 1.3.0 muss man das nicht mehr ausprobieren: die Fundliste zeigt je Gerät <i>fest</i>, <i>statisch zufällig</i> oder <i>wechselt</i>. Nur die ersten beiden taugen. Wer trotzdem ein Telefon einbinden will, lässt es als iBeacon werben und trägt statt der Adresse die Kennung <tt>ib:UUID:major:minor</tt> ein — die bleibt stabil."
K11 = "Anwesenheit flattert"
K12 = "BLE-Tags senden nicht ununterbrochen, sondern in Abständen von Sekunden bis Minuten. Der Reiter <i>Verlauf</i> zeigt je Tag die <b>größte Empfangslücke</b> der letzten 24 Stunden und schlägt daraus einen Wert für <i>Abwesend nach</i> vor. Das ersetzt das Raten."
K13 = "Umgekehrt gilt: beim <b>Kommen</b> genügte bis 1.2.10 ein einziges empfangenes Paket beliebiger Stärke. Wer möchte, dass ein Passant auf der Straße nicht das Licht einschaltet, setzt <i>Sichtungen bis anwesend</i> auf 2 oder 3 und <i>Mindest-Signalstärke</i> auf etwa −85 dBm."
K14 = "Es wird nichts gefunden"
K15 = "Reiter <i>Test</i> → die Selbstprüfung beantwortet mit Haken und Kreuz, woran es liegt. Ein <b>Strich</b> heißt: konnte nicht gemessen werden — das ist kein Haken. Seit 1.3.30 zählt der Reiter Test unter MQTT-Gateway V2 nach, ob alle Datenpunkte der Hakenliste angehakt sind und „Noncached“ stimmt."
K16 = "Die Zeile <i>Kommen überhaupt Advertisements an?</i> ist die wichtigste. Steht sie auf Kreuz, hört der Adapter nichts mehr; der Wachhund setzt ihn dann selbst neu auf."
K17 = "Manche Tags werben erst nach einem Tastendruck."
K18 = "BlueZ lässt nur <b>eine</b> Suche gleichzeitig zu. Läuft parallel ein anderes Programm mit Bluetooth-Suche, stören sie sich."
K19 = "MQTT oder HTTP"
K20 = "<b>MQTT ist der Regelweg.</b> Die Zustände kommen zurückbehalten an; nach einem Neustart des Miniservers steht die Anwesenheit sofort wieder da. Das Lebenszeichen für Loxone ist <tt>status/zaehler</tt>: es zählt höchstens alle 30 Sekunden eins weiter (0–999) und ist nie retained. <tt>server/ts</tt> bleibt für bestehende Anlagen. Ohne ein Lebenszeichen sieht ein toter Dienst in Loxone genauso aus wie ein ruhiges Haus."
K21 = "Der <b>HTTP-Weg</b> ist der Weg der Originalfassung und bleibt abschaltbar erhalten, damit bestehende Loxone-Konfigurationen weiterlaufen. Seit 1.3.0 trägt er <b>dieselben Werte wie MQTT</b>, und ein Wert, der wegen einer Störung nicht ankam, wird gemerkt und wiederholt."
K22 = "Was das Plugin außer Anwesenheit noch liefert"
K23 = "<b>Werbedaten</b>: iBeacon, Eddystone, ATC/pvvx, RuuviTag, MiBeacon (Xiaomi/Mijia, <tt>0xFE95</tt>) und die offene Qingping-Form (<tt>0xFDCD</tt>) werden dekodiert. Ein Xiaomi-Thermometer <tt>MJ_HT_V1</tt> (LYWSDCGQ/01ZM) sendet offen und liefert damit Temperatur und Luftfeuchte je Raum, ohne WLAN und ohne Cloud &mdash; seit Fassung&nbsp;1.3.13 <b>ab Werk</b>. Seit 1.3.29 liest der Dienst auch <b>verschlüsselte MiBeacon-Pakete der Fassung&nbsp;4/5</b> (z.&nbsp;B. LYWSD03MMC, MJWSD05MMC, LYWSD02MMC, XMWSDJ04MMC) &mdash; mit dem Bind-Key des Geräts (Abschnitt <i>Bind-Key und Xiaomi-Cloud</i>). Ein falscher Schlüssel ergibt keinen Wert, sondern die Lage „Bind-Key passt nicht“. Verschlüsselte Pakete der alten Form (Fassung&nbsp;2/3) werden bewusst <b>nicht</b> entschlüsselt (kein prüfbarer MIC) und als „alte Form“ gemeldet, nicht geraten. Mit einem verschlüsselnden Fühler ist das am Gerät noch nicht gemessen. Wohin die Werte in Loxone gehen, steht im Reiter <i>Einbindung in Loxone</i>."
K24 = "<b>Batteriestand</b>: bei Eddystone-TLM und RuuviTag aus den Werbedaten, sonst auf Wunsch einmal täglich über eine Verbindung. Der Verbindungsweg ist ab Werk aus — er hält den Scan an, und manche Schlüsselfinder piepen dabei."
K25 = "<b>Entfernung</b> in Metern, geschätzt aus der Signalstärke. Der Reiter <i>Test</i> hat einen Knopf, der den Bezugswert auf einem Meter misst."
K26 = "<b>Personen</b>: mehrere Tags lassen sich zu einem Menschen zusammenfassen. <tt>person/&lt;Name&gt;/present</tt> ist dann das ODER über deren Anwesenheit — das ODER muss nicht mehr in Loxone gebaut werden."
K27 = "Mehrere Scanner"
K28 = "Zwei LoxBerrys mit diesem Plugin am selben Broker überschrieben sich früher gegenseitig die Zustände. Mit einem <i>Scannernamen</i> bekommt jeder seinen eigenen Themenzweig; ist zusätzlich die <i>Raumzuordnung</i> eingeschaltet, veröffentlicht das Plugin je Tag den Namen des Scanners mit dem stärksten Signal. Wichtig sind dabei zwei Dinge, die beide einstellbar sind: eine Hysterese, damit der Raum nicht zwischen zwei Scannern springt, und ein Ausgleichswert je Scanner, weil ein USB-Adapter mit externer Antenne systematisch stärker hört als ein Pi Zero."
K29 = "Was sich gegenüber 2021.2.3 geändert hat"
K30 = "Der Scanner läuft unter <b>Python 3</b> und spricht <b>BlueZ über D-Bus</b> an. Die alte Fassung war Python 2 und benutzte pybluez sowie <tt>hciconfig</tt> — beides auf LoxBerry 4 nicht mehr vorhanden."
K31 = "Ein <b>durchlaufender Dienst</b> statt Scan auf Zuruf: Loxone muss nichts mehr abfragen."
K32 = "Seit 1.3.0 arbeitet der Dienst <b>ereignisgesteuert</b>: BlueZ meldet jede Änderung, statt dass alle paar Sekunden das ganze Objektverzeichnis abgefragt wird. Damit sieht er jedes Werbepaket statt einer Stichprobe je Runde."
K33 = "Die Zustände sind <b>ruhiger</b> geworden: die Signalstärke wird geglättet, die Signalstufe hat eine Hysterese, und die Ankunft lässt sich entprellen."
K34 = "Die vorhandene Konfiguration wird übernommen — eingetragene Tags bleiben erhalten."
K35 = "Wenn der Dienst nicht läuft"
K36 = "Dann steht über den Reitern ein Kasten mit dem, was zu tun ist. Die Kachel <i>anwesend</i>, die Tag-Tabelle, die Live-Ansicht und die Zeilen des Reiters <i>Test</i>, die aus dem Abbild des Dienstes lesen, zeigen dann <b>keine Aussage</b> samt Uhrzeit des letzten Standes - nie grün und nie anwesend. Dasselbe gilt, wenn das Abbild älter ist als dreimal der Takt (mindestens 90 Sekunden)."
K37 = "Anhalten, Sollmerker und Wächter"
K38 = "<i>Dienst anhalten</i> merkt sich die Entscheidung neben dem Datenordner (<tt>&lt;Ordner&gt;.soll_laufen</tt> mit dem Inhalt 0): der Dienst bleibt über einen Neustart des LoxBerry und über ein Update angehalten, bis <i>Dienst starten</i> gedrückt wird. Ohne diesen Merker gilt eingeschaltet. Ein Wächter (<tt>cron.05min</tt>) startet einen Dienst, der laufen soll, alle fünf Minuten nach, wenn kein Prozess läuft oder sein Abbild älter ist als fünfmal der Takt (mindestens 180 Sekunden) - höchstens dreimal je Stunde, und nie während eines Updates."
K39 = "Ausfall in Loxone erkennen"
K40 = "<tt>present</tt> und <tt>anwesend_gesamt</tt> gelten nur zusammen mit <tt>server/online</tt>. Stirbt der Dienst, bleibt der letzte Stand retained im Broker stehen; <tt>server/online</tt> setzt der Broker als Letzten Willen selbst auf 0, auch bei einem Absturz. Für die Ausfallerkennung taugen deshalb <tt>server/online</tt> und das Lebenszeichen <tt>status/zaehler</tt> (Analogwertvalidierung, Tmc 120 s), nicht <tt>server/ok</tt>. Die Seite „BLE-Scanner NG“ im Reiter <i>Einbindung in Loxone</i> verknüpft beides zu „Störung (BLE)“; solange sie anliegt, schaltet „Niemand zu Hause (BLE)“ nicht."
K41 = "Anwesenheit mit dem WLAN-Scanner (ab Werk aus)"
K42 = "Seit 1.3.28 kommen <tt>person/&lt;Person&gt;/anwesend_gesamt</tt> und <tt>/quelle</tt> immer - ohne Kopplung als BLE-Anwesenheit (Quelle <tt>ble</tt>, -1 = keine Aussage); wer die Kopplung einschaltet, verdrahtet nichts um. Im Reiter <i>Einstellungen</i> lässt sich die Anwesenheit einer Person aus diesem Plugin mit der aus dem Plugin <b>WiFi-Scanner NG</b> zusammenführen. Gekoppelt wird nur über dessen MQTT-Themen <tt>wifi_ng/&lt;Name&gt;</tt>, <tt>wifi_ng/status/ts</tt> und <tt>wifi_ng/status/ok</tt> - der WiFi-Scanner sendet sie nur, wenn dort UDP ausgeschaltet ist. Die Zuordnung nennt je Person <tt>WLAN-Name=Person</tt>. Gesendet werden <tt>person/&lt;Person&gt;/anwesend_gesamt</tt> (1, wenn eine Quelle da sagt; 0, wenn beide weg sagen; -1 ohne Aussage) und <tt>person/&lt;Person&gt;/quelle</tt>, beide retained. Schweigt der WiFi-Scanner länger als dreimal sein Takt (mindestens 3 Minuten), zählt nur BLE, und der Reiter <i>Test</i> sagt es. Ausgeschaltet räumt der Dienst beide Themen ab."
K43 = "Befehle aus Loxone (ab Werk aus)"
K44 = "Mit dem Haken <i>Befehle über MQTT annehmen</i> (Reiter <i>MQTT</i>) nimmt die Befehlsbrücke <tt>&lt;Präfix&gt;/befehl/testmodus &lt;Zweig&gt;</tt> und <tt>&lt;Präfix&gt;/befehl/kalibrierung &lt;Zweig&gt;</tt> an – Loxone schickt sie über den UDP-Eingang des MQTT-Gateways; der Zweig ist der Alias des Tags, nie seine Adresse. <tt>&lt;Präfix&gt;/befehl/batterie 1</tt> greift ein (Verbindung zum Anhänger) und braucht zusätzlich <i>Eingreifende Befehle über MQTT annehmen</i>; höchstens einmal je Stunde. Jede Antwort steht unter <tt>&lt;Präfix&gt;/befehl/&lt;Name&gt;/quittung</tt>, nie retained. Die Vorlage <i>MQTT-Befehle</i> im Reiter <i>Einbindung in Loxone</i> legt die Befehle an."
K45 = "Anwesenheit für andere Plugins (ab Werk aus)"
K46 = "Mit <i>Anwesenheit für andere Plugins bereitstellen</i> (Reiter <i>Einstellungen</i>) sendet der Dienst nach der Hausregel für Haus-Themen <tt>haus/anwesenheit/&lt;person&gt;</tt> und <tt>haus/anwesenheit/jemand</tt> (1/0, ohne Aussage <tt>-</tt>, retained) und als Lebenszeichen <tt>haus/anwesenheit/zaehler</tt> (alle 30 s, nie retained): ein Abnehmer verwendet die Anwesenheit nur, solange sich der Zähler binnen 120 s ändert. Je Tag mit dem Haken <i>an andere Plugins melden</i> kommt <tt>haus/tag/&lt;name&gt;/da</tt> dazu. Nur ein Scanner im Haus darf Anbieter sein. Beim Ausschalten und bei der Deinstallation räumt das Plugin nur seine eigenen Haus-Themen ab, mit Nachlesen am Broker."
K47 = "Telefone und Uhren mit wechselnder Adresse (IRK, ab Werk aus)"
K48 = "Ein Gerät mit wechselnder Adresse lässt sich über seinen Identitätsschlüssel (IRK, 16 Byte) erkennen: als Tag <tt>IRK:&lt;Name&gt;</tt> eintragen, einen Alias vergeben, den Schlüssel im Feld <i>Schlüssel (IRK)</i> hinterlegen und <i>Wechselnde Adressen über einen Schlüssel (IRK) auflösen</i> einschalten. Der Schlüssel steht nur in <tt>irk.json</tt> (Rechte 0600), nie im Protokoll und nie in der Oberfläche. Auflösung nach der Bluetooth-Spezifikation (Vol 3 Part H, ah()); ohne python3-cryptography rechnet das Plugin AES selbst. Eine Kopplung wird nicht angefasst. Am Gerät ist das erst mit einem echten Telefon abnehmbar."
K49 = "BTHome v2 (Shelly BLU)"
K50 = "Unverschlüsselte BTHome-v2-Geräte (z. B. Shelly BLU H&amp;T, Tür/Fenster, Bewegung, Taster) liefern Temperatur, Feuchte, Helligkeit, Fenster, Bewegung und Batterie unter <tt>&lt;Tag&gt;/sensor/…</tt>; ein Tastendruck kommt als <tt>&lt;Tag&gt;/button</tt> (press, double_press, long_press …), je Druck einmal, nie retained – im MQTT-Gateway V2 mit <i>Resetaftersend</i>. Bei einer Neuinstallation an, nach einem Update aus (Reiter <i>Einstellungen</i>). Gegen bthome.io geprüft, im Haus an keinem Gerät gemessen."
K51 = "Bind-Key und Xiaomi-Cloud"
K52 = "ESPresense und weitere Raum-Empfänger"
K53 = "Personen und Räume (ab Werk aus)"
K54 = "Der Bind-Key eines verschlüsselnden Xiaomi-Fühlers wird je MAC-Zeile unter <i>Mehr Einstellungen für diesen Tag</i> (Reiter <i>Einstellungen</i>) eingetragen: Passwortfeld, nie vorbefüllt, 32 Hexzeichen (24 Hexzeichen der alten Form werden mit Hinweis gespeichert), dazu der Haken <i>Schlüssel löschen</i>. Er liegt in <tt>bindkey.json</tt> (0600, beim Update wie <tt>irk.json</tt> gesichert); angezeigt wird nur „hinterlegt“ oder „fehlt“, nie Ziffern. Das Plugin kann den Schlüssel auch aus der <b>Xiaomi-Cloud</b> holen: Anmeldung mit Konto und Kennwort (nie gespeichert, nie protokolliert), Captcha-Bild und Zweitfaktor per Mail oder SMS im Plugin, danach eine Liste nur der Bluetooth-Geräte (Name, Modell, MAC, Region &mdash; ohne Schlüssel). Mehrere Thermometer lassen sich anhaken und mit <i>Angehakte übernehmen</i> in einem Griff übernehmen; der Schlüssel kommt an den Tag mit dieser MAC, sonst entsteht ein neuer Tag. Nach einem neuen Koppeln in Mi Home passt der Schlüssel nicht mehr und muss neu geholt werden. Die Sicherung trägt die Bind-Keys mit und ist wie ein Passwort zu behandeln; ein unpassender Eintrag darin lässt das Zurückspielen seit 1.3.38 ganz scheitern. Der Cloud-Abruf ist nur gegen eine Attrappe gemessen."
K55 = "Mit <i>Raumzuordnung aus mehreren Scannern bilden</i> (Reiter <i>Einstellungen</i>, Abschnitt <i>Mehrere Scanner</i>, ab Werk aus) meldet jeder Tag <tt>&lt;Tag&gt;/raum</tt> und <tt>&lt;Tag&gt;/raum_seit</tt>: es gewinnt der Empfänger mit dem stärksten Signal, mit Hysterese und Ausgleichswert. Empfänger sind weitere LoxBerrys mit diesem Plugin am selben Broker (jeder mit eigenem Scannernamen) und, mit dem Haken <i>ESPresense-Empfänger in die Raumzuordnung einbeziehen</i> (ab Werk aus), ESP32-Platinen mit der freien Firmware ESPresense; ihre Meldungen <tt>espresense/devices/&lt;Kennung&gt;/&lt;Raum&gt;</tt> nimmt die Raumzuordnung dazu. Welche ESPresense-Kennung zu welchem Tag gehört, steht in der <i>Zuordnung ESPresense-Kennung = Tag-Alias</i>; heißt die Kennung schon wie der Alias, braucht es keinen Eintrag. Gehörte Kennungen ohne Zuordnung nennt der Reiter <i>Test</i>. Das wirkt nur mit eingeschalteter Raumzuordnung und eingeschaltetem MQTT. <b>Empfänger liefern nur den Raum:</b> die Anwesenheit (<tt>present</tt>) bleibt die Aussage dieses LoxBerry. Gemessen ist der Weg mit ESPresense bisher nur im Selbsttest, nicht mit echten Empfängern im Haus. Seit 1.3.38 kann ein Empfänger mit dem Haken <i>Raum-Empfänger halten den Anhänger anwesend</i> (ab Werk aus, wirkt nur mit eingeschalteter Raumzuordnung) auch die Anwesenheit tragen: Hört dieser LoxBerry einen Tag nicht, zählt eine frische Meldung eines Empfängers als Sichtung &mdash; nur für einen ausdrücklich zugeordneten Tag (Paar in der Zuordnung oder Kennung gleich dem Alias), nur innerhalb von <i>Abwesend nach</i> und nur ab der <i>Mindest-Signalstärke</i>. <tt>person/&lt;Person&gt;/quelle</tt> sagt dann <tt>empfaenger</tt> (mit WLAN <tt>empfaenger+wlan</tt>); die übrigen Werte behalten ihre Bedeutung. Eine Modellkennung wie <tt>apple:1005:9-26</tt> teilen viele Geräte und gehört dann nicht in die Zuordnung. Auch das ist nur im Selbsttest gemessen."
K56 = "Mit dem Haken <i>Personen und Räume melden</i> und eingeschalteter Raumzuordnung kommen je Person mit Tag <tt>person/&lt;Person&gt;/raum</tt> (<tt>-</tt>, wenn sie nicht da ist) und <tt>person/&lt;Person&gt;/raum_seit</tt> (Zeitpunkt des letzten Wechsels der Person), dazu je Raum <tt>summary/raum/&lt;Raum&gt;/anzahl</tt> (zurückbehalten) und <tt>summary/raum/&lt;Raum&gt;/namen</tt> (flüchtig, leer, wenn niemand da ist). Hat eine Person mehrere anwesende Tags mit Raum, gilt seit 1.3.38 der Raum des Tags, der zuletzt den Raum gewechselt hat; haben die Tags ihren Raum gleich lange, bleibt der bisherige Raum der Person, sonst gilt der zuletzt gesehene Tag. Ein ruhender Schlüssel im Flur lässt den Raum so nicht mehr mit jedem Paket springen. Ein Raum erscheint, sobald einmal jemand darin war, und meldet danach 0 bis zum nächsten Dienststart. Beim Ausschalten räumt der Dienst die Themen aus dem Broker. <b>Welches Thema für „Person ist da und in Raum X“:</b> <tt>person/&lt;Person&gt;/raum</tt> &mdash; es zeigt <tt>-</tt>, sobald die Person nicht da ist. <tt>&lt;Tag&gt;/raum</tt> dagegen zeigt nach dem Verschwinden eines Anhängers noch den letzten Raum, bis die letzte Meldung dieses LoxBerry oder eines Empfängers älter ist als 30&nbsp;s bzw. als <i>Abwesend nach</i>, wenn das länger ist (die Einstellung im Reiter <i>Einstellungen</i>, nicht die Frist je Tag). Nach einem Neustart des Dienstes liest er seit 1.3.38 seine zurückbehaltenen Zeitpunkte <tt>present_since</tt> und <tt>raum_seit</tt> einmal vom Broker und behält sie, wenn Anwesenheit bzw. Raum gleich geblieben sind; ein Wert, der keine ganze Zahl ist, in der Zukunft liegt oder vor 2020, zählt nicht &mdash; dann gilt wie bisher die Startzeit."
