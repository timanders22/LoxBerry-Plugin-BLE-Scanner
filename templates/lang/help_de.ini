; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "BLE-Scanner NG"
K02 = "Erkennt Bluetooth-Low-Energy-Geräte in Reichweite und meldet dem Loxone Miniserver, ob ein hinterlegter Tag anwesend ist — samt Signalstärke. Typischer Einsatz: Schlüsselanhänger als Anwesenheitserkennung."
K03 = "In drei Schritten eingerichtet"
K04 = "Reiter <i>Einstellungen</i> → <i>Geräte suchen</i>. Der gesuchte Tag sollte dabei in der Nähe liegen."
K05 = "Gefundenes Gerät anhaken, eine Bezeichnung vergeben und speichern."
K06 = "Reiter <i>Einbindung in Loxone</i> → Vorlage herunterladen und in Loxone Config einfügen."
K07 = "Nicht jedes Gerät taugt dazu"
K08 = "Mobiltelefone, Uhren und Kopfhörer <b>wechseln ihre Bluetooth-Adresse regelmäßig</b> — oft alle 15 Minuten. Das ist eine Datenschutzfunktion und lässt sich nicht abschalten. Solche Geräte sind zur Anwesenheitserkennung unbrauchbar: die eingetragene Adresse gilt nur bis zum nächsten Wechsel."
K09 = "Zuverlässig sind einfache BLE-Beacons und Schlüsselfinder mit fester Adresse. Prüfen lässt sich das, indem man die Adresse ein paar Tage später erneut sucht: bleibt sie gleich, ist sie fest."
K10 = "Anwesenheit flattert"
K11 = "BLE-Tags senden nicht ununterbrochen, sondern in Abständen von Sekunden bis Minuten — je sparsamer, desto seltener. Meldet ein Tag ständig zwischen anwesend und abwesend, ist die <i>Abwesend nach</i>-Zeit zu kurz eingestellt. 60 bis 120 Sekunden sind bei sparsamen Tags üblich."
K12 = "Es wird nichts gefunden"
K13 = "Reiter <i>Test</i> → <i>Bluetooth prüfen</i>: wird ein Adapter aufgelistet? Ohne Adapter geht nichts — ein Raspberry Pi ohne eingebautes Bluetooth braucht einen USB-Adapter."
K14 = "Manche Tags werben erst nach einem Tastendruck."
K15 = "Reiter <i>Test</i> → <i>Zustand des Dienstes</i>: läuft er überhaupt?"
K16 = "BlueZ lässt nur <b>eine</b> Suche gleichzeitig zu. Läuft parallel ein anderes Programm mit Bluetooth-Suche, stören sie sich."
K17 = "MQTT oder HTTP"
K18 = "<b>MQTT ist der empfohlene Weg.</b> Die Zustände kommen retained an; nach einem Neustart des Miniservers steht die Anwesenheit sofort wieder da."
K19 = "Der <b>HTTP-Weg</b> ist der Weg der Originalfassung: bei jedem Wechsel wird ein virtueller Eingang am Miniserver gesetzt. Er bleibt abschaltbar erhalten, damit bestehende Loxone-Konfigurationen weiterlaufen. Die Zugangsdaten gehen dabei jetzt im Authorization-Kopf mit statt in der Adresse."
K20 = "Was sich gegenüber 2021.2.3 geändert hat"
K21 = "Der Scanner läuft unter <b>Python 3</b> und spricht <b>BlueZ über D-Bus</b> an. Die alte Fassung war Python 2 und benutzte pybluez sowie <tt>hciconfig</tt> — beides auf LoxBerry 4 nicht mehr vorhanden."
K22 = "Ein <b>durchlaufender Dienst</b> statt Scan auf Zuruf: Loxone muss nichts mehr abfragen."
K23 = "Zusätzlich zu anwesend/abwesend gibt es <b>RSSI, Signalstufe, Alter der letzten Sichtung</b> und den gemeldeten Gerätenamen."
K24 = "Die vorhandene Konfiguration wird übernommen — eingetragene Tags bleiben erhalten."
