; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "BLE-Scanner NG"
K02 = "Erkennt Bluetooth-Low-Energy-Geräte in Reichweite und meldet dem Loxone Miniserver, ob ein hinterlegter Tag anwesend ist — samt Signalstärke, Zeitstempel und, wo das Gerät sie mitsendet, Temperatur, Luftfeuchte und Batteriestand. Typischer Einsatz: Schlüsselanhänger als Anwesenheitserkennung."
K03 = "In vier Schritten eingerichtet"
K04 = "Reiter <i>Einstellungen</i> → <i>Geräte suchen</i>. Der gesuchte Tag sollte dabei in der Nähe liegen. Die Spalte <i>Adresstyp</i> sagt sofort, ob das Gerät überhaupt taugt."
K05 = "Gefundenes Gerät anhaken, eine Bezeichnung vergeben und speichern."
K06 = "Reiter <i>MQTT</i> → das Abo <tt>&lt;Präfix&gt;/#</tt> im MQTT-Gateway eintragen. <b>Ohne diesen Eintrag kommt am Miniserver nichts an</b> — das ist die häufigste Fehlerursache überhaupt."
K07 = "Reiter <i>Einbindung in Loxone</i> → Vorlage herunterladen und in Loxone Config einfügen, danach die Baustein-Liste von oben nach unten abarbeiten."
K08 = "Nicht jedes Gerät taugt dazu"
K09 = "Mobiltelefone, Uhren und Kopfhörer <b>wechseln ihre Bluetooth-Adresse regelmäßig</b> — oft alle 15 Minuten. Das ist eine Datenschutzfunktion und lässt sich nicht abschalten. Solche Geräte sind zur Anwesenheitserkennung unbrauchbar: die eingetragene Adresse gilt nur bis zum nächsten Wechsel."
K10 = "Seit 1.3.0 muss man das nicht mehr ausprobieren: die Fundliste zeigt je Gerät <i>fest</i>, <i>statisch zufällig</i> oder <i>wechselt</i>. Nur die ersten beiden taugen. Wer trotzdem ein Telefon einbinden will, lässt es als iBeacon werben und trägt statt der Adresse die Kennung <tt>ib:UUID:major:minor</tt> ein — die bleibt stabil."
K11 = "Anwesenheit flattert"
K12 = "BLE-Tags senden nicht ununterbrochen, sondern in Abständen von Sekunden bis Minuten. Der Reiter <i>Verlauf</i> zeigt je Tag die <b>größte Empfangslücke</b> der letzten 24 Stunden und schlägt daraus einen Wert für <i>Abwesend nach</i> vor. Das ersetzt das Raten."
K13 = "Umgekehrt gilt: beim <b>Kommen</b> genügte bis 1.2.10 ein einziges empfangenes Paket beliebiger Stärke. Wer möchte, dass ein Passant auf der Straße nicht das Licht einschaltet, setzt <i>Sichtungen bis anwesend</i> auf 2 oder 3 und <i>Mindest-Signalstärke</i> auf etwa −85 dBm."
K14 = "Es wird nichts gefunden"
K15 = "Reiter <i>Test</i> → die Selbstprüfung beantwortet mit Haken und Kreuz, woran es liegt. Ein <b>Strich</b> heißt: konnte nicht gemessen werden — das ist kein Haken."
K16 = "Die Zeile <i>Kommen überhaupt Advertisements an?</i> ist die wichtigste. Steht sie auf Kreuz, hört der Adapter nichts mehr; der Wachhund setzt ihn dann selbst neu auf."
K17 = "Manche Tags werben erst nach einem Tastendruck."
K18 = "BlueZ lässt nur <b>eine</b> Suche gleichzeitig zu. Läuft parallel ein anderes Programm mit Bluetooth-Suche, stören sie sich."
K19 = "MQTT oder HTTP"
K20 = "<b>MQTT ist der Regelweg.</b> Die Zustände kommen zurückbehalten an; nach einem Neustart des Miniservers steht die Anwesenheit sofort wieder da. Das Thema <tt>server/ts</tt> ist ein Herzschlag: es kommt in jedem Durchlauf. Ohne einen solchen Zeitstempel sieht ein toter Dienst in Loxone genauso aus wie ein ruhiges Haus."
K21 = "Der <b>HTTP-Weg</b> ist der Weg der Originalfassung und bleibt abschaltbar erhalten, damit bestehende Loxone-Konfigurationen weiterlaufen. Seit 1.3.0 trägt er <b>dieselben Werte wie MQTT</b>, und ein Wert, der wegen einer Störung nicht ankam, wird gemerkt und wiederholt."
K22 = "Was das Plugin außer Anwesenheit noch liefert"
K23 = "<b>Werbedaten</b>: iBeacon, Eddystone, ATC/pvvx und RuuviTag werden dekodiert. Ein Xiaomi-Thermometer mit freier Firmware liefert damit Temperatur und Luftfeuchte je Raum, ohne WLAN und ohne Cloud."
K24 = "<b>Batteriestand</b>: bei Eddystone-TLM und RuuviTag aus den Werbedaten, sonst auf Wunsch einmal täglich über eine Verbindung. Der Verbindungsweg ist ab Werk aus — er hält den Scan an, und manche Schlüsselfinder piepen dabei."
K25 = "<b>Entfernung</b> in Metern, geschätzt aus der Signalstärke. Der Reiter <i>Test</i> hat einen Knopf, der den Bezugswert auf einem Meter misst."
K26 = "<b>Personen</b>: mehrere Tags lassen sich zu einem Menschen zusammenfassen. <tt>person/&lt;Name&gt;/present</tt> ist dann das ODER über deren Anwesenheit — das ODER muss nicht mehr in Loxone gebaut werden."
K27 = "Mehrere Scanner"
K28 = "Zwei LoxBerrys mit diesem Plugin am selben Broker überschrieben sich früher gegenseitig die Zustände. Mit einem <i>Scannernamen</i> bekommt jeder seinen eigenen Themenzweig; ist zusätzlich die <i>Raumzuordnung</i> eingeschaltet, veröffentlicht das Plugin je Tag den Namen des Scanners mit dem stärksten Signal. Wichtig sind dabei zwei Dinge, die beide einstellbar sind: eine Hysterese, damit der Raum nicht zwischen zwei Scannern springt, und ein Ausgleichswert je Scanner, weil ein USB-Adapter mit externer Antenne systematisch stärker hört als ein Pi Zero."
K29 = "Was sich gegenüber 2021.2.3 geändert hat"
K30 = "Der Scanner läuft unter <b>Python 3</b> und spricht <b>BlueZ über D-Bus</b> an. Die alte Fassung war Python 2 und benutzte pybluez sowie <tt>hciconfig</tt> — beides auf LoxBerry 4 nicht mehr vorhanden."
K31 = "Ein <b>durchlaufender Dienst</b> statt Scan auf Zuruf: Loxone muss nichts mehr abfragen."
K32 = "Seit 1.3.0 arbeitet der Dienst <b>ereignisgesteuert</b>: BlueZ meldet jede Änderung, statt dass alle paar Sekunden das ganze Objektverzeichnis abgefragt wird. Damit sieht er jedes Werbepaket statt einer Stichprobe je Runde."
K33 = "Die Zustände sind <b>ruhiger</b> geworden: die Signalstärke wird geglättet, die Signalstufe hat eine Hysterese, und die Ankunft lässt sich entprellen."
K34 = "Die vorhandene Konfiguration wird übernommen — eingetragene Tags bleiben erhalten."
